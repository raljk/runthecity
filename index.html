<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Run the City — Table</title>
<meta name="description" content="One shared city. Everyone runs their crew from their own phone. Scan the table code to take a seat.">
<meta property="og:title" content="Run the City">
<meta property="og:description" content="One shared city, everyone plays from their phone. Scan the code to join.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 7v14l-12 7-12-7V9z' fill='%23ff2e93'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23101520'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* The city runs after dark, so there is one palette and no light variant:
   ink-blue asphalt, sodium amber, and neon magenta where the money is. */
:root{
  --bg:#080b12; --panel:#111624; --ink:#e7ecf7; --muted:#8793ad; --line:#222b40;
  --accent:#ff2e93; --accent-ink:#16030b; --warn-ink:#ffd6a0; --warn-bg:#2f2412; --warn-line:#6d4d1e;
  --ok:#35d98a; --off:#48526a;
  --apron:#141b27; --apron2:#0b1018; --frame:#2b3448; --frame-line:#465274;
  --warehouse:#1f8f9e; --nightlife:#d6379e; --residential:#e0a63c;
  --works:#c25a2c; --tower:#6d84a8; --deadzone:#3f434a;
  --p-red:#ff4b5c; --p-blue:#3b82ff; --p-white:#eef3fb; --p-orange:#ff9f2e;
  --piece-line:#04060b; --token:#f2efe4; --token-ink:#15171d; --token-red:#d41f3d;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 34px rgba(0,0,0,.5);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
[hidden]{display:none!important}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.55rem;font-weight:800;line-height:1.1}
h2{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
p{margin:0}
a{color:var(--accent)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px max(20px,env(safe-area-inset-right,0px)) 10px max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-family:var(--display);font-weight:800;font-size:1.1rem;letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--accent)}
.bar .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--off)}
.pill.on::before{background:var(--ok)}
.pill.on{color:var(--ink)}

.btn{appearance:none;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:10px;padding:11px 16px;cursor:pointer;min-height:44px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{min-height:32px;padding:4px 10px;font-size:.8rem;border-radius:8px}
.btn.big{width:100%;font-size:1.1rem;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
.small{font-size:.84rem}

/* ---------- host layout ---------- */
.host{display:grid;grid-template-columns:minmax(0,1fr) clamp(370px,27vw,540px);gap:20px;padding:20px;align-items:start}
@media (max-width:980px){.host{grid-template-columns:minmax(0,1fr)}}
.stage{display:flex;flex-direction:column;gap:12px;min-width:0}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:48px}
.banner .what{font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1.15;flex:1;min-width:200px}
.turnchip{display:inline-block;width:.8em;height:.8em;border-radius:3px;border:2px solid var(--piece-line);vertical-align:-.05em;margin-right:.35em}
.boardbox{border-radius:18px;overflow:hidden;box-shadow:var(--shadow);line-height:0;
  background:radial-gradient(120% 100% at 50% 22%,color-mix(in srgb,var(--apron) 42%,var(--panel)),var(--panel))}
/* The board takes the gestures: a finger slides it, two fingers pinch and
   slide. The phone layout keeps it short enough that the page still has
   somewhere to scroll from, and the confirm bar is sticky regardless. */
svg.board{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
svg.board:active{cursor:grabbing}
.host svg.board{max-height:calc(100vh - 150px)}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.join{display:flex;flex-direction:row;align-items:center;gap:16px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.09em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
#code-input{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.join.mini .qrbox{width:clamp(120px,9vw,190px)}
.join.mini .roomcode{font-size:1.5rem}
.qrbox{width:clamp(168px,13vw,290px);flex:none;background:#fff;border-radius:10px;padding:6px;line-height:0}
.qrbox svg{width:100%;height:auto;display:block}
.qrfallback{line-height:1.3;color:#333;font-size:.8rem;padding:12px}
.joininfo{display:flex;flex-direction:column;gap:4px;min-width:0}
.roomcode{font-family:var(--display);font-weight:800;font-size:2.3rem;letter-spacing:.12em;line-height:1}
.joinurl{font-size:.78rem;overflow-wrap:anywhere}
.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:.86rem}
.warn code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;background:rgba(0,0,0,.08);padding:1px 5px;border-radius:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input[type=text]{flex:1;min-width:0}
input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;font-size:16px}
.seats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.seat{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.seat.open{border-style:dashed;color:var(--muted)}
.seat.active{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.chip{width:26px;height:26px;border-radius:7px;border:2px solid var(--piece-line)}
.seat .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .sub{font-size:.78rem;color:var(--muted)}
.seat .sub .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--off);margin-right:5px}
.seat .sub .dot.on{background:var(--ok)}
.seat .end{display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.dice{font-size:1.7rem;line-height:1;letter-spacing:.05em}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{appearance:none;border:0;background:transparent;padding:10px;cursor:pointer;font-weight:600;min-height:44px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted);max-height:180px;overflow:auto}
.log li:first-child{color:var(--ink)}

/* ---------- phone layout ---------- */
.phone{max-width:560px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.phone .boardbox{margin-inline:-16px;border-radius:0}
.phone svg.board{max-height:64vh}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{appearance:none;border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.78rem;font-weight:600;min-height:64px}
.sw .chip{width:30px;height:30px}
.sw[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.sw:disabled{opacity:.35;cursor:not-allowed}
.me{display:flex;align-items:center;gap:10px}
.me .chip{width:34px;height:34px;border-radius:9px}
.me .nm{font-family:var(--display);font-weight:800;font-size:1.3rem;line-height:1.1}
.hand{display:flex;gap:8px;flex-wrap:wrap}
.res{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px 6px 6px;font-weight:700;text-transform:capitalize}
.res b{display:inline-grid;place-items:center;width:30px;height:38px;border-radius:6px;border:2px solid var(--piece-line);color:#fff;font-family:var(--display);font-size:1.05rem;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.res b.dk{color:#14110a;text-shadow:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);line-height:1.2}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--piece-line)}
.ico{display:inline-block;width:34px;height:34px;flex:none;background:center/contain no-repeat}
.legend .ico{width:20px;height:20px;border:0;border-radius:0}
.res.art{padding:4px 12px 4px 6px}
.res.art strong{font-family:var(--display);font-size:1.25rem;font-variant-numeric:tabular-nums}
.hero{aspect-ratio:3/2;border-radius:10px;background:var(--apron2) var(--hero) center/cover no-repeat;margin:-4px -4px 4px}
.hex.art{stroke:#efe2b8;stroke-width:3.5}
.actionbar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.actionbar .btn{flex:1;box-shadow:var(--shadow)}
.rolls{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rolls li{display:flex;align-items:center;gap:10px}
.rolls .chip{width:20px;height:20px;border-radius:5px}
.rolls .grow{flex:1;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:.88rem;box-shadow:var(--shadow);z-index:20;max-width:calc(100vw - 32px);text-align:center}

/* ---------- the move card ----------
   The first thing on the phone, every turn: whose move it is, what that move
   is, and what you can do about it. */
.move{display:flex;flex-direction:column;gap:5px}
.mtitle{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.1}
.move.you .mtitle{color:var(--accent)}
.mnow{font-size:1.02rem;font-weight:600}
/* the last roll, and what it paid you: the two things you look for after every turn, so they are big */
.roll{--d:54px;display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.roll .rdice{display:flex;align-items:center;gap:9px}
.roll .die{border-radius:11px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.2),0 2px 6px rgba(0,0,0,.5)}
.roll .sum{font-family:var(--display);font-weight:800;font-size:3.4rem;font-variant-numeric:tabular-nums;line-height:.9;margin-left:5px;color:var(--token)}
.roll.hot .sum{color:#ff5a6a;text-shadow:0 0 18px rgba(255,90,106,.45)}
.roll .rgain{display:flex;align-items:center;gap:10px}
.roll .rgain .lab{font-family:var(--display);font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--ok);line-height:1.15}
.roll .rnote{flex-basis:100%;font-size:.84rem}
.banner .bdice{--d:38px;display:inline-flex;align-items:center;gap:6px;vertical-align:middle;margin-left:.35em}
.banner .bdice .die{border-radius:8px}
.banner .bdice strong{font-size:2rem;line-height:1;margin-left:4px;font-variant-numeric:tabular-nums}
.banner .bdice.hot strong{color:#ff5a6a}
.moves{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.opt{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:58px;cursor:pointer;font-weight:700}
.opt:disabled{cursor:not-allowed;border-style:dashed;color:var(--muted)}
.opt:disabled .ico{filter:grayscale(1);opacity:.5}
.opt .grow{flex:1;min-width:0}
.opt.stack{flex-direction:column;align-items:stretch;gap:3px}
.opt .top{display:flex;align-items:center;gap:10px}
.opt .top .nm{flex:1;min-width:0}
.opt .why{display:block;font-weight:500;font-size:.79rem;color:var(--muted);text-transform:none}
.opt[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.opt .chip{width:22px;height:22px;border-radius:6px;flex:none}
.cost{display:inline-flex;align-items:center;gap:1px;flex:none}
.cost .ico{width:18px;height:18px}
.cost b{font-size:.76rem;margin-right:4px}
.cost b:last-child{margin-right:0}
.picks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pick{appearance:none;border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 2px;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:700;cursor:pointer;min-height:66px;text-transform:capitalize}
.pick .ico{width:26px;height:26px}
.pick .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;text-transform:none;white-space:nowrap}
.pick[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.pick:disabled{opacity:.3;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chipx{appearance:none;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--bg);
  color:inherit;border-radius:99px;padding:5px 10px;font-size:.8rem;font-weight:700;cursor:pointer;text-transform:capitalize;min-height:34px}
.chipx .ico{width:20px;height:20px}
.chipx:hover{border-color:var(--accent);color:var(--accent)}
.tally{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:.86rem}
.tally li{display:flex;align-items:center;gap:8px;padding:4px 0}
.tally .chip{width:16px;height:16px;border-radius:4px;flex:none}
.tally .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tally .now{color:var(--accent);font-weight:700}
.tally .num{font-variant-numeric:tabular-nums;color:var(--muted)}

/* ---------- resource cards ----------
   A resource looks the same wherever it turns up: a card in its district's
   colour with its picture on it. The hand, the prices, the trades and the
   cards that fly across the table all use this one shape. */
.rc{position:relative;display:inline-grid;place-items:center;width:46px;height:62px;flex:none;border-radius:9px;
  border:2px solid var(--piece-line);background:var(--rc,#555);color:#fff;vertical-align:middle;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.2),inset 0 -16px 18px rgba(0,0,0,.24),0 2px 5px rgba(0,0,0,.5)}
.rc .ico{width:74%;height:auto;aspect-ratio:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.rc>b{font-family:var(--display);font-weight:800;font-size:1.25em;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.rc .n{position:absolute;right:-7px;top:-7px;min-width:21px;height:21px;padding:0 5px;border-radius:99px;display:grid;place-items:center;
  background:var(--ink);color:var(--bg);font:800 .78rem/1 var(--display);border:2px solid var(--piece-line);font-variant-numeric:tabular-nums}
.rc.m{width:34px;height:46px;border-radius:7px}
.rc.s{width:24px;height:33px;border-radius:5px;border-width:1.5px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.2),0 1px 3px rgba(0,0,0,.5)}
.rc.s .n{right:-6px;top:-6px;min-width:16px;height:16px;padding:0 3px;font-size:.62rem;border-width:1.5px}
.rc.miss{background:transparent;border-style:dashed;border-color:color-mix(in srgb,var(--rc,#888) 80%,var(--line));box-shadow:none}
.rc.miss .ico{opacity:.3;filter:grayscale(.75)}
.rc.miss>b{opacity:.4}
.rc.back{background:repeating-linear-gradient(135deg,#1b2338 0 5px,#2a3556 5px 10px)}
.rc.any{background:var(--bg);border-style:dashed;border-color:var(--muted);color:var(--muted);box-shadow:none}
.bundle{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px}
.fan{display:inline-flex;align-items:center}
.fan .rc+.rc{margin-left:-30px}
.fan.m .rc+.rc{margin-left:-21px}
.fan.s .rc+.rc{margin-left:-14px}
.fanbtn{appearance:none;border:0;background:none;padding:4px;margin:-4px;cursor:pointer;border-radius:8px;position:relative}
.fanbtn::after{content:"\00d7";position:absolute;right:-2px;bottom:-2px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;
  background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:.8rem;line-height:1}

/* the hand: always five places, so a card has somewhere to land before you own one */
.handgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.hslot{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;font-weight:700;text-transform:capitalize;color:var(--muted);min-width:0}
.hslot strong{font-family:var(--display);font-size:1.3rem;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.hslot.none strong{color:var(--off)}
.hslot.bump .rc{animation:bump .45s cubic-bezier(.2,.9,.3,1.4)}
.hslot.bump strong{animation:bumpn .45s ease-out}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.22) rotate(-4deg)}100%{transform:scale(1)}}
@keyframes bumpn{0%{color:var(--accent);transform:scale(1.5)}100%{transform:scale(1)}}

/* a trade, as two piles with an arrow between them */
.deal{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg)}
.deal .pile{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.deal .pile.r{align-items:flex-end;text-align:right}
.deal .pile.r .bundle{justify-content:flex-end}
.deal .lab{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.deal .none{font-size:.8rem;color:var(--muted);min-height:46px;display:flex;align-items:center}
.swapi{width:26px;height:26px;flex:none;fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pick .rc{margin-bottom:1px}
.pick.cardy{min-height:92px;padding:8px 2px 6px}
.rates{display:flex;gap:8px;flex-wrap:wrap}
.rates span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

/* what you can make: the piece, then its price in cards. A card you hold is
   lit; one you are missing is an empty outline. */
.pi{width:30px;height:30px;flex:none;stroke:var(--piece-line);stroke-width:1.6;stroke-linejoin:round}
.opt.stack{gap:7px}
.opt .recipe{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.opt .recipe .why{flex:1;min-width:120px}
.opt.can{border-color:color-mix(in srgb,var(--ok) 65%,var(--line))}
.opt .go{flex:none;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--bg);background:var(--ok);border-radius:99px;padding:3px 8px}
div.opt{cursor:default}
div.opt.cant{border-style:dashed;color:var(--muted)}

/* ---------- sections that fold away ---------- */
.slot:empty{display:none}
.sec{gap:12px}
.sec.bare{display:flex;flex-direction:column;gap:8px}
.sec.shut{padding-top:10px;padding-bottom:10px}
.sechead{appearance:none;border:0;background:none;padding:0;margin:0;width:100%;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;min-height:28px;color:inherit}
.sechead:disabled{cursor:default}
.sechead .h{font-family:var(--display);font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);flex:none}
.sechead .grow{flex:1}
.sechead .peek{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:9px;flex-wrap:wrap;font-size:.8rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.sechead .peek .pk{display:inline-flex;align-items:center;gap:4px}
.sechead .peek .pi{width:22px;height:22px}
.sechead .peek .pk.no{opacity:.28}
/* the key: five cards in the header that cost no room, and a panel of names when you ask */
.keybtn{appearance:none;display:inline-flex;align-items:center;gap:4px;margin-left:auto;padding:3px 4px 3px 8px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);cursor:pointer;
  font:700 .7rem var(--display);text-transform:uppercase;letter-spacing:.09em}
.keybtn .rc{width:19px;height:26px;border-radius:4px;border-width:1.5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.keybtn .rc+.rc{margin-left:-3px}
.keybtn .lab{margin-right:4px}
.keybtn[aria-expanded=true]{border-color:var(--accent);color:var(--ink)}
.keybtn[aria-expanded=false] .chev{transform:rotate(-90deg)}
.keybtn .chev{width:16px;height:16px}
/* on the table screen the key is simply always there: nobody taps a shared screen from across the room */
.hkey{display:flex;align-items:center;gap:6px 18px;flex-wrap:wrap}
.hk{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;font-weight:700;line-height:1.1;text-transform:capitalize}
.hk .rc{width:22px;height:30px;border-radius:5px;border-width:1.5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.hk strong,.hk em{display:block}
.hk em{font-style:normal;font-weight:500;font-size:.68rem;color:var(--muted)}
@media (max-width:820px){.hk em{display:none}.hkey{gap:6px 12px}}
@media (max-width:560px){.hk strong{display:none}.hkey{gap:4px;flex-wrap:nowrap}}
.keypanel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 10px 10px;display:flex;flex-direction:column;gap:10px}
.keypanel .kp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.keypanel .k{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.keypanel .k strong{font-size:.74rem;text-transform:capitalize;line-height:1.1}
.keypanel .k span.d{font-size:.64rem;color:var(--muted);text-transform:capitalize;line-height:1.1}
.keypanel .k i.ksw{width:22px;height:8px;border-radius:3px;border:1.5px solid var(--piece-line)}
.sechead .peek .chip{width:12px;height:12px;border-radius:3px;border-width:1.5px}
.chev{width:20px;height:20px;flex:none;fill:none;stroke:var(--muted);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
.sec.shut .chev{transform:rotate(-90deg)}
.offerbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.offerbar .who{font-family:var(--display);font-weight:700;font-size:1.05rem}
.offerbar .deal{flex:1;min-width:260px;border:0;padding:0;background:none}
.offerbar .says{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.offerbar .say{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-weight:700;border:1px solid var(--line);border-radius:99px;padding:3px 9px 3px 5px;color:var(--muted)}
.offerbar .say .chip{width:14px;height:14px;border-radius:4px;border-width:1.5px}
.offerbar .say.yes{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 60%,var(--line))}
.seat .backs{display:inline-flex;align-items:center;gap:5px}
.seat .backs.bump{animation:bumpn .45s ease-out}
.camctl button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* the bar floats over the page, so a greyed button in it must not turn see-through */
.actionbar .btn:disabled{opacity:1;background:color-mix(in srgb,var(--accent) 34%,var(--panel));color:color-mix(in srgb,var(--accent-ink) 55%,var(--muted))}
.actionbar .btn.ghost,.actionbar .btn.ghost:disabled{background:var(--panel);border-color:var(--line)}
.actionbar .btn.ghost:disabled{color:var(--muted)}

/* ---------- board pieces ---------- */
/* Stroke widths and font sizes are written per frame so they hold their
   apparent size as the camera moves, which is why they are not pinned here:
   a rule in the stylesheet would beat the attribute on the element. */
.hexline{fill:none;stroke:rgba(196,214,244,.52);stroke-width:2.5;stroke-linejoin:round}
.hlabel{font-family:var(--body);font-weight:800;letter-spacing:.1em;text-anchor:middle;fill:#14110a}
.hlabel.lt{fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.45);stroke-width:2.2px}
.sign rect,.hb rect{fill:rgba(10,14,22,.82)}
.sign line{stroke:rgba(214,228,246,.26)}
.sign rect{stroke:rgba(214,228,246,.34)}
.sign text,.hb text{font-family:var(--display);font-weight:700;text-anchor:middle;fill:#dfe8f5}
.sign .pip{fill:rgba(223,232,245,.5);stroke:none}
.sign.red rect{stroke:var(--token-red);fill:rgba(30,8,12,.84)}
.sign.red text{fill:#ff6a72}.sign.red .pip{fill:rgba(255,106,114,.66)}
.pier{stroke:rgba(150,166,196,.5);stroke-linecap:round}
.hb .r{font-family:var(--body);font-weight:800;letter-spacing:.06em}
.police{pointer-events:none}
.police polygon{stroke:rgba(6,8,14,.45);stroke-width:.6;stroke-linejoin:round}
.pc{pointer-events:none}
.lf{pointer-events:none}
.hexhit{fill:transparent;stroke:none;cursor:pointer}
.flag{pointer-events:none}
.flag text{font-family:var(--display);font-weight:800}
.flagup{animation:flagup .22s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes flagup{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.flagup{animation:none}}
.lastring{fill:none;stroke:#fff;stroke-width:2.5;stroke-dasharray:4 4}
.spot,.espot{cursor:pointer}
.spot .hit,.espot .hit{fill:transparent;stroke:transparent}
.spot .casing{fill:var(--piece-line);opacity:.3}
.espot .ecasing{stroke:var(--piece-line);stroke-linecap:round;opacity:.6}
.espot.sel .ecasing{display:none}
.spot .dot{fill:rgba(255,255,255,.78);transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
.espot .dash{stroke:#fff;stroke-linecap:round;animation:fade 1.5s ease-in-out infinite}
.spot.sel .dot{animation:none;stroke:var(--piece-line)}
.espot.sel .dash{animation:none}
.espot .under{stroke:var(--piece-line);stroke-linecap:round}

/* ---------- camera ---------- */
.board3d{line-height:0}
.camctl{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px;line-height:1.45;
  background:var(--panel);border-top:1px solid var(--line)}
.camctl button{appearance:none;display:inline-grid;place-items:center;width:42px;height:42px;padding:0;
  border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);cursor:pointer}
.camctl button.wide{width:auto;padding:0 14px;font-size:.82rem;font-weight:700}
.camctl button:hover{border-color:var(--accent);color:var(--accent)}
.camctl svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@keyframes pulse{0%,100%{transform:scale(.85);opacity:.45}50%{transform:scale(1.06);opacity:.78}}
@keyframes fade{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.spot .dot,.espot .dash{animation:none}}

/* ---------- the dice machine, and cards in flight ----------
   Everything here lives in one fixed layer over the page and takes no taps,
   so it can never get between a thumb and a button. */
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden;contain:layout style}
.flyc{position:absolute;left:0;top:0;will-change:transform,opacity}
.payring{position:absolute;left:0;top:0;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;border:4px solid var(--token);
  box-shadow:0 0 22px 4px rgba(255,255,255,.55),inset 0 0 14px rgba(255,255,255,.4);animation:payring .7s ease-out 3 both}
@keyframes payring{0%{transform:scale(.35);opacity:0}30%{opacity:1}100%{transform:scale(1.25);opacity:0}}
.slotm{--d:88px;position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 22px 14px;border-radius:22px;
  background:linear-gradient(#1a2036,#0b0f1c);border:3px solid var(--accent);color:var(--ink);
  box-shadow:0 0 0 5px #05070d,0 0 46px 6px color-mix(in srgb,var(--accent) 55%,transparent),0 24px 60px rgba(0,0,0,.7);
  transition:transform .5s cubic-bezier(.3,.8,.3,1),opacity .4s;transform-origin:50% 0}
.slotm.small{--d:58px;padding:12px 16px 10px;border-radius:16px;gap:7px}
.slotm .cap{font-family:var(--display);font-weight:800;font-size:calc(var(--d)*.25);letter-spacing:.02em;white-space:nowrap;display:flex;align-items:center}
.slotm .win{display:flex;align-items:center;gap:calc(var(--d)*.14);padding:calc(var(--d)*.12);border-radius:14px;background:#04060b;border:2px solid #2a3350;
  box-shadow:inset 0 6px 16px rgba(0,0,0,.9)}
.reel{width:var(--d);height:var(--d);overflow:hidden;border-radius:12px;position:relative;background:#0d111d}
.reel::after{content:"";position:absolute;inset:0;border-radius:12px;pointer-events:none;
  background:linear-gradient(rgba(0,0,0,.72),transparent 30%,transparent 70%,rgba(0,0,0,.72))}
.strip{display:flex;flex-direction:column;will-change:transform}
.die{width:var(--d);height:var(--d);flex:none;display:inline-grid;vertical-align:middle;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14%;border-radius:12px;
  background:linear-gradient(145deg,#fffdf5,#d9d3c1);box-shadow:inset 0 0 0 2px rgba(0,0,0,.2)}
.die i{place-self:center;width:72%;aspect-ratio:1;border-radius:50%}
.die i.p{background:radial-gradient(circle at 35% 30%,#4a4f60,#0c0e15 70%)}
.slotm .sum{min-width:calc(var(--d)*1.05);text-align:center;font:800 calc(var(--d)*.86)/1 var(--display);font-variant-numeric:tabular-nums;
  color:var(--token);opacity:0;transform:scale(.2)}
.slotm.done .sum{animation:sumpop .55s cubic-bezier(.2,.9,.3,1.5) forwards}
.slotm.hot .sum{color:#ff5a6a}
@keyframes sumpop{0%{opacity:0;transform:scale(.2) rotate(-12deg)}60%{opacity:1;transform:scale(1.3) rotate(3deg);text-shadow:0 0 34px currentColor}100%{opacity:1;transform:scale(1);text-shadow:0 0 14px currentColor}}
.slotm .pay{min-height:calc(var(--d)*.42);display:flex;align-items:center;gap:8px;font-weight:700;font-size:calc(var(--d)*.19);opacity:0;transition:opacity .3s;white-space:nowrap}
.slotm.done .pay{opacity:1}
.slotm .bulb{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#4d3a12;animation:bulb .54s steps(1) infinite}
.slotm.small .bulb{width:7px;height:7px;margin:-3.5px 0 0 -3.5px}
@keyframes bulb{0%{background:#ffe9a3;box-shadow:0 0 9px 2px #ffc94d}34%{background:#4d3a12;box-shadow:none}}
.slotm.done .bulb{animation-duration:.2s}
.slotm.seven{border-color:#ff3347;box-shadow:0 0 0 5px #05070d,0 0 54px 10px rgba(255,51,71,.6),0 24px 60px rgba(0,0,0,.7)}
.slotm.seven.done .bulb{animation-name:bulbcop;animation-duration:.4s}
.slotm.seven.done .bulb:nth-child(odd){animation-delay:-.2s}
@keyframes bulbcop{0%{background:#ff3347;box-shadow:0 0 10px 3px #ff3347}50%{background:#2f6bff;box-shadow:0 0 10px 3px #2f6bff}}
.slotm.seven.done{animation:shake .4s linear 2}
@keyframes shake{0%,100%{margin-left:0}25%{margin-left:-7px}75%{margin-left:7px}}
.slotm.away{opacity:0}
</style>
</head>

/* =====================================================================

const BROKERS = [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://test.mosquitto.org:8081/mqtt',
];
const TOPIC_ROOT = 'runthecity/v1/';
const COLORS = ['red', 'blue', 'white', 'orange'];
const RESOURCE_OF = { warehouse: 'product', nightlife: 'talent', residential: 'cash', works: 'muscle', tower: 'influence', deadzone: null };
const TERRAIN_OF = { product: 'warehouse', talent: 'nightlife', cash: 'residential', muscle: 'works', influence: 'tower' };
const RES_ORDER = ['muscle', 'product', 'talent', 'cash', 'influence'];
const PIPS = { 2: 1, 3: 2, 4: 3, 5: 4, 6: 5, 8: 5, 9: 4, 10: 3, 11: 2, 12: 1 };
// Number tokens in A–R order, laid along the spiral.
const TOKENS = [5, 2, 6, 3, 8, 10, 9, 12, 11, 4, 8, 10, 9, 4, 5, 6, 3, 11];
const MAX_PLAYERS = 4;
/* What a turn costs, in the city's own words. Every price matches base Catan:
   street = road, operation = settlement, major holding = city. */
const COST = {
  street:    { muscle: 1, product: 1 },
  operation: { muscle: 1, product: 1, talent: 1, cash: 1 },
  holding:   { cash: 2, influence: 3 },
};
const STOCK = { street: 15, operation: 5, holding: 4 };
const PIECE = { street: 'street', operation: 'operation', holding: 'major holding' };
const WIN_VP = 10;
const HAND_SAFE = 7;   // hold more than this when a seven lands and you lose half

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function rnd(n) { // unbiased integer in [0, n)
  const a = new Uint32Array(1), lim = Math.floor(0x100000000 / n) * n;
  do { crypto.getRandomValues(a); } while (a[0] >= lim);
  return a[0] % n;
}
function shuffle(list) { const a = list.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function makeCode(n, abc) { let s = ''; for (let i = 0; i < n; i++) s += abc[rnd(abc.length)]; return s; }
function setHTML(sel, html) { const el = $(sel); if (!el || el.__h === html) return; el.__h = html; el.innerHTML = html; }
function store(key, val) { try { if (val === null) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* private mode */ } }
function load(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; } }
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const ordinal = n => (n === 1 ? 'first' : 'second');
const DIE = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

/* =====================================================================
   Board geometry: 19 pointy-top hexes in rows 3-4-5-4-3, 54 intersections,
   72 paths. Hex index order is rows top to bottom, left to right.
   ===================================================================== */
const S = 60, R3 = Math.sqrt(3);
const GEO = (() => {
  const hexes = [], verts = [], edges = [], vKey = new Map(), eKey = new Map();
  for (let r = -2; r <= 2; r++) for (let q = Math.max(-2, -2 - r); q <= Math.min(2, 2 - r); q++) {
    hexes.push({ q, r, cx: S * R3 * (q + r / 2), cy: S * 1.5 * r, dist: Math.max(Math.abs(q), Math.abs(r), Math.abs(-q - r)), vs: [], es: [] });
  }
  hexes.forEach((h, hi) => {
    // corner k sits at angle 60k-30 degrees: 0 upper-right, 1 lower-right, 2 bottom, 3 lower-left, 4 upper-left, 5 top
    for (let k = 0; k < 6; k++) {
      const ang = (60 * k - 30) * Math.PI / 180, x = h.cx + S * Math.cos(ang), y = h.cy + S * Math.sin(ang);
      const key = Math.round(x) + ',' + Math.round(y);
      let id = vKey.get(key);
      if (id === undefined) { id = verts.length; vKey.set(key, id); verts.push({ x, y, hexes: [], adj: [], edges: [] }); }
      verts[id].hexes.push(hi); h.vs.push(id);
    }
    // edge k joins corner k and k+1: 0 east, 1 south-east, 2 south-west, 3 west, 4 north-west, 5 north-east
    for (let k = 0; k < 6; k++) {
      const a = h.vs[k], b = h.vs[(k + 1) % 6], key = Math.min(a, b) + '-' + Math.max(a, b);
      let id = eKey.get(key);
      if (id === undefined) {
        id = edges.length; eKey.set(key, id); edges.push({ a, b, hexes: [] });
        verts[a].adj.push(b); verts[b].adj.push(a); verts[a].edges.push(id); verts[b].edges.push(id);
      }
      edges[id].hexes.push(hi); h.es.push(id);
    }
  });
  const neighbours = hexes.map(() => []);
  edges.forEach(e => { if (e.hexes.length === 2) { neighbours[e.hexes[0]].push(e.hexes[1]); neighbours[e.hexes[1]].push(e.hexes[0]); } });

  // Walk the 30 coastal paths clockwise, starting at the north-west side of the top-left hex.
  // Harbors sit at fixed steps along that walk; this reproduces the printed frame of the beginner map.
  const isCoast = e => edges[e].hexes.length === 1;
  const coast = []; let e = hexes[0].es[4], from = hexes[0].vs[4];
  for (let i = 0; i < 30; i++) {
    coast.push(e);
    const to = edges[e].a === from ? edges[e].b : edges[e].a;
    const cur = e; e = verts[to].edges.find(x => x !== cur && isCoast(x)); from = to;
  }
  const terminalEdges = [0, 3, 7, 10, 13, 17, 20, 23, 27].map(i => coast[i]);

  // Token spiral: counter-clockwise round the outer ring from a corner, then the inner ring
  // starting on the hex that touches that corner, then the centre.
  const ccw = h => { const a = Math.atan2(-h.cy, h.cx); return a < 0 ? a + 2 * Math.PI : a; };
  const ring = d => hexes.map((h, i) => ({ i, a: ccw(h) })).filter(o => hexes[o.i].dist === d).sort((x, y) => x.a - y.a);
  const outer = ring(2), inner = ring(1), centre = hexes.findIndex(h => h.dist === 0);
  const cornerSlots = outer.map((o, idx) => idx).filter(idx => { const h = hexes[outer[idx].i]; return h.q === 0 || h.r === 0 || h.q + h.r === 0; });
  function spiral(corner) {
    const at = cornerSlots[corner], o = [...outer.slice(at), ...outer.slice(0, at)];
    let k = 0, best = 9;
    inner.forEach((n, idx) => { let d = Math.abs(n.a - outer[at].a); d = Math.min(d, 2 * Math.PI - d); if (d < best) { best = d; k = idx; } });
    return [...o.map(x => x.i), ...[...inner.slice(k), ...inner.slice(0, k)].map(x => x.i), centre];
  }
  return { hexes, verts, edges, neighbours, terminalEdges, spiral };

/* One description of what the table is waiting for. Both screens read this, so
   they can never disagree about whose move it is or what it is. */
function guide(st, pid) {

  const yours = !!me && act === pid, who = ap ? ap.name : 'the table';
  const mine = (now, hint) => ({ yours: true, act, ap, title: 'Your move', now, hint: hint || '' });
  const theirs = (now, hint) => ({ yours: false, act, ap, title: me ? `Waiting on ${who}` : who, now, hint: hint || '' });
  if (st.phase === 'lobby') return { yours: false, act, ap, title: 'In the lobby', now: me ? 'Waiting for the table to start the game.' : 'Scan the code to take a seat.', hint: '' };
  if (st.phase === 'rolloff') {
    const rolled = me && st.rolls[pid];
    return { yours: !!me && st.contenders.includes(pid) && !rolled, act, ap, title: rolled ? 'Waiting on the others' : me ? 'Your move' : 'Roll for first player',
      now: rolled ? `You rolled ${rolled[0] + rolled[1]}.` : 'Roll the dice. Highest roll places first.', hint: '' };
  }
  if (st.phase === 'over') {
    const w = playerOf(st, st.win);
    return { yours: false, act: null, ap: null, title: w && w.pid === pid ? 'You run the city' : `${w ? w.name : 'Nobody'} runs the city`,
      now: `${WIN_VP} points. The game is over.`, hint: 'Use Back to lobby on the table screen to play again.' };
  }
  if (st.phase === 'place' || st.phase === 'done') {
    if (st.phase === 'done') return theirs('Set-up is complete.');
    const nth = st.placeIdx < st.order.length ? 1 : 2;

      ? mine(st.step === 'operation' ? `Tap a glowing spot for your ${ordinal(nth)} operation.` : 'Tap a glowing path beside the operation you just placed.',

      : theirs(`${who} is placing ${st.step === 'street' ? 'a street' : 'an operation'}.`, 'Nothing for you to do until your turn.');
  }
  // the turn itself
  const owe = me && st.pend ? (st.pend[pid] || 0) : 0;
  if (st.step === 'discard') {
    const owing = Object.keys(st.pend).map(id => playerOf(st, id)).filter(Boolean).map(x => x.name);
    if (owe) return { yours: true, act, ap, title: 'Your move', now: `Seven rolled. Drop ${owe} ${owe === 1 ? 'card' : 'cards'}.`, hint: 'Anyone holding more than seven loses half of them.' };
    return { yours: false, act, ap, title: `Waiting on ${andList(owing)}`, now: `Seven rolled. ${andList(owing)} must drop half their cards.`,
      hint: me ? 'You are under eight cards, so your hand is safe.' : '' };

    : theirs(`${who} is moving the police.`, 'Nothing for you to do until your turn.');
  if (st.step === 'steal') return yours ? mine('Take one card, unseen, from somebody on that block.')
    : theirs(`${who} is taking a card.`, 'Nothing for you to do until your turn.');
  if (st.step === 'roll') return yours ? mine('Roll the dice. Every block on that number pays out.')
    : theirs(`${who} is about to roll.`, 'Nothing for you to do until your turn. You still collect on their roll.');
  const o = st.offer;
  if (yours) {
    if (o) {
      const yes = Object.keys(o.replies).filter(id => o.replies[id] === 1).map(id => playerOf(st, id)).filter(Boolean).map(x => x.name);
      const out = st.players.filter(x => x.pid !== pid && o.replies[x.pid] === undefined).map(x => x.name);

      if (out.length) return mine(`Your offer is with ${andList(out)}.`, 'Build or end your turn while you wait.');

        now: `${who} will give you ${handList(o.give)} for ${handList(o.want)}.`,
        hint: holds(me, o.want) ? 'Take it or pass. It is their turn either way.' : `You do not hold ${handList(o.want)}, so this one is not for you.` };

  deadzone:    { count: 2, w: [18, 26], d: [14, 20], h: [7, 12], body: [86, 86, 94],

/* If the art pipeline has not run, or one elevation is missing, that surface

/* a small deterministic generator, so a block's skyline never shuffles under you */

  Math.abs(x * 0.5 - z * 0.8660254) <= INRADIUS - INSET - pad;

/* One prism: four walls, back-face culled, and a roof. A wall takes its

   below that, and while the camera is moving, it falls back to flat colour. */
function prism(P, C, cx, cz, w, d, h, rot, base, m, defs, id, fast) {
  const ca = Math.cos(rot), sa = Math.sin(rot);
  const corner = (sx, sz) => [cx + (sx * w / 2) * ca - (sz * d / 2) * sa, cz + (sx * w / 2) * sa + (sz * d / 2) * ca];
  const c = [corner(-1, -1), corner(1, -1), corner(1, 1), corner(-1, 1)];
  const lo = c.map(p => P(p[0], base, p[1])), hi = c.map(p => P(p[0], base + h, p[1]));

    if (!faces(C, N[k], [(c[k][0] + c[j][0]) / 2, base + h / 2, (c[k][1] + c[j][1]) / 2])) continue;
    const q = [hi[k], hi[j], lo[j], lo[k]];
    g.push(!fast && ART && m.wall && area(q) > 220
      ? skin(defs, id + 'w' + k, q, m.wall, shade(N[k]) * 0.45)
      : '<polygon points="' + pts(q) + '" fill="' + lit(N[k], m.body, .5) + '"' + EDGE + '/>');

    ? skin(defs, id + 'r', hi, m.roof, shade([0, 1, 0]) * 0.45)

/* One block's worth of buildings, sorted among themselves and joined into one string. */
function massing(P, C, hex, kind, base, defs, i, fast) {
  const m = MASS[kind], parts = [];
  cityPlan(i, kind).forEach((b, n) => {

    if (!main) return;

    if (b.cap) {
      const ca = Math.cos(b.rot), sa = Math.sin(b.rot);
      const top = prism(P, C, hex.cx + b.x + b.cap.dx * ca - b.cap.dz * sa,

        b.cap.w, b.cap.d, b.cap.h, b.rot, base + b.h, m, defs, id + 'c', fast);

/* The police marker: an officer with more braid than rank, and a case he
   ought not to be carrying. Built from the same boxes as everything else and
   turned to face the camera, so the cap peak, the badge and the payoff stay
   readable from wherever you are standing. */
function policeHTML(C, cx, cz, base) {
  let ux = C.bx, uz = C.bz;

  const nx = -uz, nz = ux;

  const SKIN = [176, 138, 108], GOLD = [222, 180, 78], CASE = [86, 58, 38];

      ux, uz, len, wide, tall, body, front ? rgb(front) : null, null);

  g += box(0, 0, 13, 10, 14, 14, NAVY, SHIRT);         // tunic, open at the front
  g += box(0, 0, 27, 11, 15.5, 2.5, GOLD);             // rather a lot of shoulder braid

    ? `<ellipse cx="${n1(foot.x)}" cy="${n1(foot.y)}" rx="${n1(14 * foot.k)}" ` +
      `ry="${n1(14 * foot.k * Math.max(.18, Math.sin(CAM.pitch * Math.PI / 180)))}" fill="rgba(0,0,0,.34)"/>` : '';

/* =====================================================================
   Traffic, and the people on the pavement.

   The board only redraws when the camera moves, so between frames the city

   a few dozen headlights running the street grid and slower specks walking

const LIFE = { cars: [], feet: [], raf: 0, last: 0, still: false, live: new Set(), slots: [] };

function liveEdges(st) {
  const set = new Set();
  Object.keys(st.buildings).forEach(v => {
    const vert = GEO.verts[v];
    if (!vert) return;
    vert.edges.forEach(e => set.add(e));

/* Park whatever the city cannot justify, and put the rest on a street that is

function retune() {
  const live = LIFE.live, pool = live.size ? Array.from(live) : null;

    const wanted = i < want;

        o.from = Math.random() < 0.5 ? GEO.edges[o.e].a : GEO.edges[o.e].b;
        o.t = Math.random();

const HEADLIGHT = ['#fff6dd', '#ffeec6', '#eef7ff'], TAILLIGHT = ['#ff3b2e', '#ff5a3a'];
const CAR_BODY = [[38, 44, 58], [52, 40, 46], [34, 52, 60], [58, 54, 48], [44, 38, 62]];
const COAT = [[74, 66, 84], [88, 74, 66], [62, 72, 88], [92, 84, 72]];

function makeLife() {
  if (LIFE.cars.length) return;
  const r = seeded(0x51F2C17);
  const pick = () => Math.floor(r() * GEO.edges.length);
  for (let i = 0; i < 52; i++) {
    const e = pick(), red = r() < 0.42;
    LIFE.cars.push({ e, from: r() < 0.5 ? GEO.edges[e].a : GEO.edges[e].b, t: r(),
      v: 0.17 + r() * 0.16, body: CAR_BODY[i % CAR_BODY.length],
      head: HEADLIGHT[i % 3], tail: TAILLIGHT[i % 2], lane: red ? -1 : 1 });
  }
  for (let i = 0; i < 30; i++) {
    const e = pick();
    LIFE.feet.push({ e, from: r() < 0.5 ? GEO.edges[e].a : GEO.edges[e].b, t: r(),
      v: 0.035 + r() * 0.03, side: r() < 0.5 ? 1 : -1,
      way: r() < 0.5 ? 1 : -1, coat: COAT[i % COAT.length] });

/* At the end of a street, take any street but the one just travelled. */

    let outs = GEO.verts[to].edges.filter(x => x !== o.e);

      if (busy.length) outs = busy;

/* A box on the road, turned to face the way it is travelling. Four upright

   car headlights and tail lights without a single extra element. */

  const paint = [front, null, rear, null];

  for (let k = 0; k < 4; k++) {
    const j = (k + 1) % 4;
    if (!faces(C, N[k], [(c[k][0] + c[j][0]) / 2, y + tall / 2, (c[k][1] + c[j][1]) / 2])) continue;
    const col = paint[k] || lit(N[k], body, .42);
    out += `<polygon points="${pts([hi[k], hi[j], lo[j], lo[k]])}" fill="${col}"/>`;

/* How many blocks sit in front of something at this depth. That is the slot it
   belongs in, which is what lets a building hide the car behind it. */
function slotFor(d) {
  let n = 0;
  while (n < LIFE.slots.length && LIFE.slots[n] > d) n++;

}
function lifeParts(C, B) {
  const out = [];
  const put = (d, html) => { const n = slotFor(d); out[n] = (out[n] || '') + html; };
  LIFE.cars.forEach(c => {
    if (c.parked) return;
    const e = GEO.edges[c.e], A = GEO.verts[c.from], D = GEO.verts[e.a === c.from ? e.b : e.a];
    const dx = D.x - A.x, dz = D.y - A.y, L = Math.hypot(dx, dz) || 1, ux = dx / L, uz = dz / L;
    // two lanes: which side you drive on follows which way you are going

    const cx = A.x + dx * c.t + ox, cz = A.y + dz * c.t + oz;
    const body = roadBox(C, cx, cz, STREET_Y + 0.15, ux, uz, 7, 3.2, 2.6, c.body, c.head, c.tail);
    if (!body) return;
    // the pool of light the headlights throw on the road ahead
    const g1 = project(cx + ux * 4, STREET_Y + 0.05, cz + uz * 4, C);
    const g2 = project(cx + ux * 11, STREET_Y + 0.05, cz + uz * 11, C);
    const beam = g1 && g2
      ? `<line x1="${n1(g1.x)}" y1="${n1(g1.y)}" x2="${n1(g2.x)}" y2="${n1(g2.y)}" stroke="${c.head}" ` +
        `stroke-width="${n1(3.4 * g1.k)}" stroke-linecap="round" opacity=".13"/>` : '';
    const at = project(cx, STREET_Y + 1.3, cz, C);

    if (f.parked) return;

    const dx = D.x - A.x, dz = D.y - A.y, L = Math.hypot(dx, dz) || 1;
    const nx = -dz / L * (INSET - 1.5) * f.side, nz = dx / L * (INSET - 1.5) * f.side;  // onto the pavement
    const px = A.x + dx * f.t + nx, pz = A.y + dz * f.t + nz;
    const b = roadBox(C, px, pz, STREET_Y + 0.15, dx / L * f.way, dz / L * f.way, 1.5, 1.5, 3.8, f.coat, null, null);
    const at = project(px, STREET_Y + 1.9, pz, C);

}
/* The clock. Held still for anyone who has asked for less motion, and

   slots afterwards, so a board that has not changed is the same string as
   last time and the page can leave it alone. */
function paintLife() {
  const slots = document.querySelectorAll('svg.board .lf');
  if (!slots.length || !G.state) return false;
  const parts = lifeParts(basis(), G.state.board);
  slots.forEach(g => {                                   // only touch a slot that changed
    const html = parts[+g.dataset.lf] || '';
    if (g.__h !== html) { g.__h = html; g.innerHTML = html; }
  });

function tickLife(now) {

  if (LITE.on || !G.state) return;
  const dt = LIFE.last ? Math.min(0.1, (now - LIFE.last) / 1000) : 0;
  LIFE.last = now;
  if (dt) {
    LIFE.cars.forEach((c, i) => { if (!c.parked) advance(c, dt, i < AMBIENT); });
    LIFE.feet.forEach((f, i) => { if (!f.parked) advance(f, dt, i < 1); });

  LIFE.raf = requestAnimationFrame(tickLife);
}

function runLife() {
  if (LITE.on || !G.state) return;
  paintLife(); loopLife();
}
function stopLife() { if (LIFE.raf) cancelAnimationFrame(LIFE.raf); LIFE.raf = 0; LIFE.last = 0; }

/* Simple view: blocks and solid colours. The painted tiles, the lit windows,
   the modelled buildings, the lane markings and all of the traffic go, which
   on a phone is most of what the board costs to draw: every texture is a
   picture squeezed through a clip path, and the traffic repaints them sixty
   times a second. What is left is the game: coloured blocks, their numbers,
   and the pieces. Each screen chooses for itself and remembers. */
const LITE = { on: load('rtcity.lite') === true };

/* Everything the mouse can hit, remembered in screen units so that a tap
   near a spot still finds it once the board is tilted. */
const PROJ = { v: Object.create(null), e: Object.create(null), h: Object.create(null) };

/* =====================================================================

  o = o || {};

  if (!lite) makeLife();

  const P = (x, y, z) => project(x, y, z, C);
  PROJ.v = Object.create(null); PROJ.e = Object.create(null); PROJ.h = Object.create(null);

  const cast = RIM_PTS.map(p => P(p[0] * 1.05 + 26, SLAB_Y - 1, p[1] * 1.05 + 20));
  if (cast.every(Boolean)) back.push(`<polygon points="${pts(cast)}" fill="rgba(0,0,0,.28)"/>`);
  if (rimT.every(Boolean) && rimB.every(Boolean)) {
    for (let k = 0; k < 6; k++) {
      const j = (k + 1) % 6, mx = (RIM_PTS[k][0] + RIM_PTS[j][0]) / 2, mz = (RIM_PTS[k][1] + RIM_PTS[j][1]) / 2, m = Math.hypot(mx, mz);
      const n = [mx / m, 0, mz / m];
      if (!faces(C, n, [mx, (RIM_Y + SLAB_Y) / 2, mz])) continue;
      const q = [rimT[k], rimT[j], rimB[j], rimB[k]];
      back.push(!fast && ART ? skin(defs, `w${k}`, q, 'wall_edge', shade(n))
        : `<polygon points="${pts(q)}" fill="${lit(n, EDGE_RGB, .32)}"/>`);
    }
    back.push(`<polygon points="${pts(rimT)}" fill="${lit([0, 1, 0], RIM_RGB, .55)}"/>`);
  }
  const apronT = APRON_PTS.map(p => P(p[0], RIM_Y, p[1])), apron = APRON_PTS.map(p => P(p[0], APRON_Y, p[1]));
  if (apronT.every(Boolean) && apron.every(Boolean)) {
    for (let k = 0; k < 6; k++) {                                   // inner wall of the rim, seen across the board
      const j = (k + 1) % 6, mx = (APRON_PTS[k][0] + APRON_PTS[j][0]) / 2, mz = (APRON_PTS[k][1] + APRON_PTS[j][1]) / 2, m = Math.hypot(mx, mz);
      const n = [-mx / m, 0, -mz / m];
      if (!faces(C, n, [mx, (RIM_Y + APRON_Y) / 2, mz])) continue;
      back.push(`<polygon points="${pts([apronT[k], apronT[j], apron[j], apron[k]])}" fill="${lit(n, RIM_RGB, .3)}"/>`);
    }
    back.push(`<polygon points="${pts(apron)}" fill="${lit([0, 1, 0], APRON_RGB, .6)}"/>`);
    if (!fast && ART) {
      const w = APRON_R * 2, a = P(-w / 2, APRON_Y, -w / 2), b = P(w / 2, APRON_Y, -w / 2), c = P(-w / 2, APRON_Y, w / 2);
      if (a && b && c) {
        defs.push(`<clipPath id="k-apron"><polygon points="${pts(apron)}"/></clipPath>`);
        back.push(`<g clip-path="url(#k-apron)"><g transform="matrix(${n1(b.x - a.x)},${n1(b.y - a.y)},${n1(c.x - a.x)},${n1(c.y - a.y)},${n1(a.x)},${n1(a.y)})"><use href="#img-apron"/></g></g>`);
      }
    }
  }

  /* ---------- the street grid ----------
     Pavement over the whole platform, then a carriageway down the middle of
     every hexagon edge, a patch at each junction, and a broken line along the
     centre. It all lies flat at one height, below everything that stands up,
     so it can be drawn in one go before the blocks are sorted. */
  GEO.hexes.forEach(h => {
    const q = h.vs.map(v => P(GEO.verts[v].x, STREET_Y, GEO.verts[v].y));
    if (q.every(Boolean)) back.push(`<polygon points="${pts(q)}" fill="${lit([0, 1, 0], PAVE_RGB, .74)}"/>`);
  });
  GEO.edges.forEach(e => {                                          // the drop from the streets to the apron
    if (e.hexes.length !== 1) return;
    const A = GEO.verts[e.a], D = GEO.verts[e.b], hx = GEO.hexes[e.hexes[0]];
    const mx = (A.x + D.x) / 2 - hx.cx, mz = (A.y + D.y) / 2 - hx.cy, m = Math.hypot(mx, mz), n = [mx / m, 0, mz / m];
    if (!faces(C, n, [(A.x + D.x) / 2, STREET_Y / 2, (A.y + D.y) / 2])) return;
    const a1 = P(A.x, STREET_Y, A.y), b1 = P(D.x, STREET_Y, D.y), b0 = P(D.x, APRON_Y, D.y), a0 = P(A.x, APRON_Y, A.y);
    if (!a1 || !b1 || !b0 || !a0) return;
    back.push(`<polygon points="${pts([a1, b1, b0, a0])}" fill="${lit(n, BANK_RGB, .5)}"/>`);
  });
  const ROAD = INSET - 2.5;
  GEO.edges.forEach(e => {                                          // the carriageway itself
    const A = GEO.verts[e.a], D = GEO.verts[e.b];
    const dx = D.x - A.x, dz = D.y - A.y, L = Math.hypot(dx, dz) || 1;
    let nx = -dz / L, nz = dx / L, off = 0;
    if (e.hexes.length === 1) {                                     // a coast road only has an inside
      const hx = GEO.hexes[e.hexes[0]];
      if (nx * (hx.cx - (A.x + D.x) / 2) + nz * (hx.cy - (A.y + D.y) / 2) < 0) { nx = -nx; nz = -nz; }
      off = ROAD / 2;
    }
    const q = [[A.x + nx * (off + ROAD), A.y + nz * (off + ROAD)], [D.x + nx * (off + ROAD), D.y + nz * (off + ROAD)],
               [D.x + nx * (off - ROAD), D.y + nz * (off - ROAD)], [A.x + nx * (off - ROAD), A.y + nz * (off - ROAD)]]
      .map(c => P(c[0], STREET_Y + 0.05, c[1]));
    if (q.every(Boolean)) back.push(`<polygon points="${pts(q)}" fill="${lit([0, 1, 0], ROAD_RGB, .82)}"/>`);
  });
  GEO.verts.forEach(v => {                                          // fill the junctions
    const q = Array.from({ length: 6 }, (_, k) => {
      const a = k * Math.PI / 3;
      return P(v.x + Math.cos(a) * ROAD * 1.15, STREET_Y + 0.1, v.y + Math.sin(a) * ROAD * 1.15);
    });
    if (q.every(Boolean)) back.push(`<polygon points="${pts(q)}" fill="${lit([0, 1, 0], ROAD_RGB, .82)}"/>`);
  });
  if (!lite) GEO.edges.forEach(e => {                               // the broken white line
    if (e.hexes.length === 1) return;
    const A = GEO.verts[e.a], D = GEO.verts[e.b];
    const p1 = P(A.x + (D.x - A.x) * 0.2, STREET_Y + 0.2, A.y + (D.y - A.y) * 0.2);
    const p2 = P(A.x + (D.x - A.x) * 0.8, STREET_Y + 0.2, A.y + (D.y - A.y) * 0.8);
    if (!p1 || !p2) return;
    back.push(`<line x1="${n1(p1.x)}" y1="${n1(p1.y)}" x2="${n1(p2.x)}" y2="${n1(p2.y)}" ` +
      `stroke="rgba(226,214,164,.45)" stroke-width="${n1(1.2 * p1.k)}" ` +
      `stroke-dasharray="${n1(5 * p1.k)} ${n1(7 * p1.k)}" stroke-linecap="round"/>`);
  });

  /* how deep each tile sits, so anything standing on one can be drawn after it */
  const tileD = GEO.hexes.map((h, i) => { const p = P(h.cx, TOP_Y[B.hexes[i].t], h.cy); return p ? p.d : -1; });

  /* ---------- import/export terminals, out on the water ---------- */
  B.terminals.forEach((type, i) => {
    const e = GEO.edges[GEO.terminalEdges[i]], hi = e.hexes[0], h = GEO.hexes[hi], a = GEO.verts[e.a], b = GEO.verts[e.b];
    const mx = (a.x + b.x) / 2, mz = (a.y + b.y) / 2, dx = mx - h.cx, dz = mz - h.cy, len = Math.hypot(dx, dz);
    const hx = mx + dx / len * 35, hz = mz + dz / len * 35, top = TOP_Y[B.hexes[hi].t];
    const p = P(hx, APRON_Y + 4, hz), pa = P(a.x, STREET_Y, a.y), pb = P(b.x, STREET_Y, b.y);
    if (!p || !pa || !pb) return;
    const col = type === 'any' ? 'var(--frame-line)' : `var(--${TERRAIN_OF[type]})`;
    const label = type === 'any' ? '3:1 terminal, any resource' : `2:1 ${type} terminal`;
    add(p.d, `<g class="hb"><title>${label}</title>` +
      `<line class="pier" x1="${n1(p.x)}" y1="${n1(p.y)}" x2="${n1(pa.x)}" y2="${n1(pa.y)}" stroke-width="${n1(3.4 * p.k)}"/>` +
      `<line class="pier" x1="${n1(p.x)}" y1="${n1(p.y)}" x2="${n1(pb.x)}" y2="${n1(pb.y)}" stroke-width="${n1(3.4 * p.k)}"/>` +
      `<rect x="${n1(p.x - (type === 'any' ? 12 : 20) * p.k)}" y="${n1(p.y - (type === 'any' ? 8.5 : 10.5) * p.k)}" ` +
        `width="${n1((type === 'any' ? 24 : 40) * p.k)}" height="${n1((type === 'any' ? 17 : 21) * p.k)}" ` +
        `rx="${n1(3.4 * p.k)}" style="stroke:${col}" stroke-width="${n1(1.3 * p.k)}"/>` +
      `<text x="${n1(p.x)}" y="${n1(p.y + (type === 'any' ? 4 : -0.6) * p.k)}" style="font-size:${n1(11 * p.k)}px">${type === 'any' ? '3:1' : '2:1'}</text>` +
      (type === 'any' ? '' : `<text class="r" x="${n1(p.x)}" y="${n1(p.y + 7.6 * p.k)}" style="font-size:${n1(7 * p.k)}px;fill:${col}">${type.toUpperCase()}</text>`) + '</g>');
  });

  /* ---------- the nineteen city blocks ---------- */
  GEO.hexes.forEach((h, i) => {
    if (tileD[i] < 0) return;
    const t = B.hexes[i], top = TOP_Y[t.t], g = [];
    const ix = v => h.cx + (GEO.verts[v].x - h.cx) * SHRINK;        // pulled back behind the kerb
    const iz = v => h.cy + (GEO.verts[v].y - h.cy) * SHRINK;
    const vT = h.vs.map(v => P(ix(v), top, iz(v)));
    const vB = h.vs.map(v => P(ix(v), STREET_Y, iz(v)));
    if (!vT.every(Boolean) || !vB.every(Boolean)) return;
    for (let k = 0; k < 6; k++) {                                   // the retaining wall up from the pavement
      const j = (k + 1) % 6, ax = ix(h.vs[k]), az = iz(h.vs[k]), dx = ix(h.vs[j]), dz = iz(h.vs[j]);
      const mx = (ax + dx) / 2 - h.cx, mz = (az + dz) / 2 - h.cy, m = Math.hypot(mx, mz), n = [mx / m, 0, mz / m];
      if (!faces(C, n, [(ax + dx) / 2, (top + STREET_Y) / 2, (az + dz) / 2])) continue;
      const q = [vT[k], vT[j], vB[j], vB[k]];
      g.push(!fast && ART && area(q) > 240 ? skin(defs, `c${i}-${k}`, q, 'wall_strata', shade(n) * 0.7)
        : `<polygon points="${pts(q)}" fill="${lit(n, SIDE_RGB[t.t], .56)}"/>`);
    }
    if (!fast && ART) {                                             // the painted tile, fitted to the tilted top
      const w = S * R3 * SHRINK, d = 2 * S * SHRINK;
      const a = P(h.cx - w / 2, top, h.cy - d / 2), b = P(h.cx + w / 2, top, h.cy - d / 2), c = P(h.cx - w / 2, top, h.cy + d / 2);
      if (a && b && c) {
        defs.push(`<clipPath id="k${i}"><polygon points="${pts(vT)}"/></clipPath>`);
        g.push(`<g clip-path="url(#k${i})"><g transform="matrix(${n1(b.x - a.x)},${n1(b.y - a.y)},${n1(c.x - a.x)},${n1(c.y - a.y)},${n1(a.x)},${n1(a.y)})"><use href="#img-${t.t}"/></g></g>`);
        // A wash of the district's own colour. At table size it barely shows; on a
        // phone, where a block is a thumbnail, it is what tells the districts apart.
        g.push(`<polygon points="${pts(vT)}" style="fill:var(--${t.t});opacity:.10"/>`);
        g.push(`<polygon class="hexline" points="${pts(vT)}"/>`);
      }
    } else g.push(`<polygon class="hexline" points="${pts(vT)}" style="fill:${lit([0, 1, 0], TOP_RGB[t.t], .6)}"/>`);
    if (!lite) g.push(massing(P, C, h, t.t, top, defs, i, fast));   // the model stands up even without the art

    const mid = P(h.cx, top, h.cy);   // the block's name is raised on demand, not painted on
    // The number as a small lit sign on a post, the way a block would be marked
    // in this city, rather than a bakelite disc borrowed from another game.
    const sign = P(h.cx, top + 13, h.cy);
    if (t.n && mid && sign) {
      const k = sign.k, red = t.n === 6 || t.n === 8, p = PIPS[t.n];
      const w = (t.n > 9 ? 25 : 20) * k, hh = 19 * k;
      let dots = '';
      for (let q = 0; q < p; q++)
        dots += `<circle class="pip" cx="${n1(sign.x + (q - (p - 1) / 2) * 3.3 * k)}" cy="${n1(sign.y + 5.4 * k)}" r="${n1(1.05 * k)}"/>`;
      g.push(`<g class="sign${red ? ' red' : ''}">` +
        `<line x1="${n1(mid.x)}" y1="${n1(mid.y)}" x2="${n1(sign.x)}" y2="${n1(sign.y + hh / 2)}" stroke-width="${n1(1.1 * k)}"/>` +
        `<rect x="${n1(sign.x - w / 2)}" y="${n1(sign.y - hh / 2)}" width="${n1(w)}" height="${n1(hh)}" rx="${n1(3.2 * k)}" stroke-width="${n1(1.1 * k)}"/>` +
        `<text x="${n1(sign.x)}" y="${n1(sign.y + 1.2 * k)}" style="font-size:${n1(12.5 * k)}px">${t.n}</text>${dots}</g>`);
    }
    add(tileD[i], g.join(''));
  });

  /* ---------- streets, operations, holdings, police ---------- */
  Object.keys(st.streets).forEach(id => {
    const e = GEO.edges[id], p = playerOf(st, st.streets[id]); if (!e || !p) return;
    const s = street(P, C, e, `var(--p-${p.color})`, STREET_Y);
    if (s) add(Math.min(...e.hexes.map(i => tileD[i])) - 1, s);
  });
  Object.keys(st.buildings).forEach(id => {
    const v = GEO.verts[id], bd = st.buildings[id], p = bd && playerOf(st, bd.pid); if (!v || !p) return;
    const s = building(P, C, v, `var(--p-${p.color})`, STREET_Y, bd.k === 'c');
    if (s) add(Math.min(...v.hexes.map(i => tileD[i])) - 1, s);
  });
  const rh = GEO.hexes[B.police], rt = TOP_Y[B.hexes[B.police].t], off = B.hexes[B.police].n ? 27 : 0;
  const cop = policeHTML(C, rh.cx + off, rh.cy + (off ? 6 : 2), rt);
  if (cop) add(tileD[B.police] - 2, `<g class="police"><title>Police pressure</title>${cop}</g>`);

  /* ---------- the spots you can still take ----------
     These sit above the island so a tilted board can never hide a legal move, but
     they are still sorted among themselves: the nearest marker has to be the one on
     top, or the board would show one dot and the tap would find another. */
  const col = o.color ? `var(--p-${o.color})` : 'var(--accent)', spots = [];
  (o.legalV || []).forEach(id => {
    const v = GEO.verts[id], p = P(v.x, STREET_Y + 16, v.y); if (!p) return;
    PROJ.v[id] = { x: p.x, y: p.y, k: p.k };
    const sel = o.sel && o.sel.kind === 'v' && o.sel.id === id, k = p.k;
    spots.push({ d: p.d, s: `<g class="spot${sel ? ' sel' : ''}" data-v="${id}" tabindex="0" role="button" aria-pressed="${!!sel}" aria-label="Operation spot beside ${esc(nearHexes(B, v.hexes))}">` +
      `<circle class="hit" cx="${n1(p.x)}" cy="${n1(p.y)}" r="${n1(30 * k)}"/>` +
      `<circle class="casing" cx="${n1(p.x)}" cy="${n1(p.y)}" r="${sel ? 0 : n1(8.5 * k)}"/>` +
      `<circle class="dot" cx="${n1(p.x)}" cy="${n1(p.y)}" r="${n1((sel ? 12 : 5.6) * k)}" stroke="${col}" stroke-width="${n1((sel ? 3.4 : 2.2) * k)}"${sel ? ` style="fill:${col}"` : ''}/></g>` });
  });
  (o.legalE || []).forEach(id => {
    const e = GEO.edges[id], a = GEO.verts[e.a], b = GEO.verts[e.b], y = STREET_Y + 12;
    const p1 = P(a.x + (b.x - a.x) * .22, y, a.y + (b.y - a.y) * .22), p2 = P(a.x + (b.x - a.x) * .78, y, a.y + (b.y - a.y) * .78);
    if (!p1 || !p2) return;
    PROJ.e[id] = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2, k: (p1.k + p2.k) / 2 };
    const sel = o.sel && o.sel.kind === 'e' && o.sel.id === id, k = PROJ.e[id].k;
    const L = `x1="${n1(p1.x)}" y1="${n1(p1.y)}" x2="${n1(p2.x)}" y2="${n1(p2.y)}"`;
    spots.push({ d: (p1.d + p2.d) / 2, s: `<g class="espot${sel ? ' sel' : ''}" data-e="${id}" tabindex="0" role="button" aria-pressed="${!!sel}" aria-label="Street along ${esc(nearHexes(B, e.hexes, 2))}">` +
      `<line class="hit" ${L} stroke-width="${n1(50 * k)}"/>` +
      `<line class="ecasing" ${L} stroke-width="${n1(11 * k)}" stroke-dasharray="${n1(k)} ${n1(11 * k)}"/>` +
      (sel ? `<line class="under" ${L} stroke-width="${n1(13 * k)}"/>` : '') +
      `<line class="dash" ${L} stroke-width="${n1((sel ? 8 : 7) * k)}" stroke-dasharray="${sel ? 'none' : n1(k) + ' ' + n1(11 * k)}"${sel ? ` style="stroke:${col}"` : ''}/></g>` });
  });
  spots.sort((a, b) => b.d - a.d).forEach(x => front.push(x.s));
  /* Blocks the police can be sent to. The ring is drawn on top so a tilted board
     cannot hide it, but it takes no taps: the transparent lid on the block does
     that, and it is the shape the finger is actually aiming at. */
  (o.legalH || []).forEach(i => {
    const h = GEO.hexes[i], p = P(h.cx, TOP_Y[B.hexes[i].t] + 30, h.cy); if (!p) return;
    PROJ.h[i] = { x: p.x, y: p.y, k: p.k };
    const sel = o.sel && o.sel.kind === 'h' && o.sel.id === i;
    front.push(`<g class="pc"><circle cx="${n1(p.x)}" cy="${n1(p.y)}" r="${n1((sel ? 17 : 11) * p.k)}" ` +
      `fill="${sel ? col : 'rgba(8,11,18,.55)'}" stroke="${col}" stroke-width="${n1((sel ? 4 : 2.6) * p.k)}"/></g>`);
  });
  if (st.phase === 'place' && st.step === 'street' && st.lastV != null) {
    const v = GEO.verts[st.lastV], p = P(v.x, STREET_Y + 16, v.y);
    if (p) front.push(`<circle class="lastring" cx="${n1(p.x)}" cy="${n1(p.y)}" r="${n1(19 * p.k)}"/>`);
  }

  /* A transparent lid on each block, so the pointer knows which one it is over.
     It goes in before the spot markers, which stay on top and stay pickable. */
  GEO.hexes.forEach((h, i) => {
    if (tileD[i] < 0) return;
    const q = h.vs.map(v => P(h.cx + (GEO.verts[v].x - h.cx) * SHRINK, TOP_Y[B.hexes[i].t],
                              h.cy + (GEO.verts[v].y - h.cy) * SHRINK, C));
    if (q.every(Boolean)) hits.push(`<polygon class="hexhit" data-hex="${i}" points="${pts(q)}"/>`);
  });

  scene.sort((a, b) => b.d - a.d);
  let body;
  if (lite) body = scene.map(x => x.s).join('');
  else {
    LIFE.slots = scene.map(x => x.d);
    LIFE.live = liveEdges(st);
    retune();
    body = '<g class="lf" data-lf="0"></g>' + scene.map((x, n) => x.s + `<g class="lf" data-lf="${n + 1}"></g>`).join('');
  }
  const live = (o.legalV && o.legalV.length) || (o.legalE && o.legalE.length);
  return `<svg class="board" viewBox="${viewBox(C)}" role="${live ? 'group' : 'img'}" aria-label="The city board in three dimensions${live ? ', with spots you can pick' : ''}">` +
    `<defs>${defs.join('')}</defs>${back.join('')}${body}${hits.join('')}${front.join('')}` +
    `<g class="flag">${flagHTML(C, B, ui.hex)}</g></svg>`;
}

/* A street: a bar of colour lying along the edge, with its sides shaded. */
function street(P, C, e, col, top) {
  const A = GEO.verts[e.a], B2 = GEO.verts[e.b];
  const dx = B2.x - A.x, dz = B2.y - A.y, L = Math.hypot(dx, dz), ux = dx / L, uz = dz / L, nx = -uz, nz = ux, hw = 5.5, ht = 9;
  const base = [[.18, 1], [.82, 1], [.82, -1], [.18, -1]].map(([t, s]) => [A.x + dx * t + nx * hw * s, A.y + dz * t + nz * hw * s]);
  const lo = base.map(p => P(p[0], top, p[1])), hi = base.map(p => P(p[0], top + ht, p[1]));
  if (lo.some(p => !p) || hi.some(p => !p)) return '';
  const g = [];
  const N = [[nx, 0, nz], [ux, 0, uz], [-nx, 0, -nz], [-ux, 0, -uz]];
  for (let k = 0; k < 4; k++) {
    const j = (k + 1) % 4, mp = [(base[k][0] + base[j][0]) / 2, top + ht / 2, (base[k][1] + base[j][1]) / 2];
    if (!faces(C, N[k], mp)) continue;
    g.push(`<polygon points="${pts([hi[k], hi[j], lo[j], lo[k]])}" fill="${col}" style="fill:${col};filter:brightness(${(0.5 + 0.5 * Math.max(0, N[k][0] * LIGHT[0] + N[k][2] * LIGHT[2])).toFixed(2)})" stroke="var(--piece-line)" stroke-width="1.1"/>`);
  }
  g.push(`<polygon points="${pts(hi)}" fill="${col}" stroke="var(--piece-line)" stroke-width="1.2"/>`);
  return `<g class="pc">${g.join('')}</g>`;
}

/* An operation is a little house; a major holding is the same house grown a
   storey with a tower, so the two read apart at a glance from any angle. */
function building(P, C, v, col, top, big) {
  const w = big ? 13 : 11, wall = big ? 17 : 13, ridge = big ? 31 : 26;
  const sq = [[-w, -w], [w, -w], [w, w], [-w, w]];
  const lo = sq.map(p => P(v.x + p[0], top, v.y + p[1]));
  const hi = sq.map(p => P(v.x + p[0], top + wall, v.y + p[1]));
  const r1 = P(v.x - w, top + ridge, v.y), r2 = P(v.x + w, top + ridge, v.y);
  const sh = P(v.x, top, v.y);
  if (lo.some(p => !p) || hi.some(p => !p) || !r1 || !r2 || !sh) return '';
  const g = [`<ellipse cx="${n1(sh.x)}" cy="${n1(sh.y)}" rx="${n1(w * 1.5 * sh.k)}" ry="${n1(w * 1.5 * sh.k * Math.max(.18, Math.sin(CAM.pitch * Math.PI / 180)))}" fill="rgba(0,0,0,.3)"/>`];
  const N = [[0, 0, -1], [1, 0, 0], [0, 0, 1], [-1, 0, 0]];
  const sv = ['#000', '#fff'];
  for (let k = 0; k < 4; k++) {
    const j = (k + 1) % 4, mp = [v.x + (sq[k][0] + sq[j][0]) / 2, top + wall / 2, v.y + (sq[k][1] + sq[j][1]) / 2];
    if (!faces(C, N[k], mp)) continue;
    g.push(shadeFace([hi[k], hi[j], lo[j], lo[k]], N[k], col));
  }

  let b = parseInt(params.get('b'), 10);
  if (!(b >= 0 && b < BROKERS.length)) b = parseInt(joinRoom.slice(-1), 10) - 2;
  if (!(b >= 0 && b < BROKERS.length)) b = 0;
  try {
    G.client = await openClient(BROKERS[b], 'rtcity-' + (WATCH ? 'w' + makeCode(7, ROOM_ABC) : PID) + '-' + makeCode(4, ROOM_ABC), WATCH ? null : { topic: P.base + '/pres/' + PID, body: '0' }, {
      message: (topic, body) => {

        if (topic !== P.base + '/state') return;

  if (cf) {
    ev.preventDefault();
    const code = ($('#code-input').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length < 5) { toast('Enter the code shown on the table screen.'); $('#code-input').focus(); return; }
    const watch = ev.submitter && ev.submitter.dataset.mode === 'watch';
    location.href = pageBase() + '?room=' + code + (watch ? '&watch=1' : ''); return;
  }
  const f = ev.target.closest('[data-form=base]'); if (!f) return; ev.preventDefault();
  const v = $('#base-input').value.trim(); store('rtcity.base', v || null); renderHost();
});

bindCamera(document);
LIFE.still = matchMedia('(prefers-reduced-motion: reduce)').matches;
document.addEventListener('visibilitychange', () => { if (document.hidden) stopLife(); else runLife(); });

(() => {                                                  // pick up where this screen left the camera
  const c = load('rtcity.cam');
  if (c && ['yaw', 'pitch', 'zoom'].every(k => typeof c[k] === 'number' && isFinite(c[k]))) {
    CAM.yaw = c.yaw; CAM.pitch = c.pitch; CAM.zoom = c.zoom; clampCam();
  }
})();

let autohost = false; try { autohost = sessionStorage.getItem('rtcity.autohost') === '1'; } catch (e) { /* private mode */ }
if (joinRoom) bootPlayer();
else if (load('rtcity.host') || autohost) bootHost(); // this browser already runs a table: go straight back to it
else renderLanding();
})();
</script>
</body>
</html>
