<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Run the City — Table</title>
<meta name="description" content="One shared city. Everyone runs their crew from their own phone. Scan the table code to take a seat.">
<meta property="og:title" content="Run the City">
<meta property="og:description" content="One shared city, everyone plays from their phone. Scan the code to join.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 7v14l-12 7-12-7V9z' fill='%23ff2e93'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23101520'/%3E%3C/svg%3E">

<style>
/* The city runs after dark, so there is one palette and no light variant:
   ink-blue asphalt, sodium amber, and neon magenta where the money is. */
:root{
  --bg:#080b12; --panel:#111624; --ink:#e7ecf7; --muted:#8793ad; --line:#222b40;
  --accent:#ff2e93; --accent-ink:#16030b; --warn-ink:#ffd6a0; --warn-bg:#2f2412; --warn-line:#6d4d1e;
  --ok:#35d98a; --off:#48526a;
  --apron:#141b27; --apron2:#0b1018; --frame:#2b3448; --frame-line:#465274;
  --warehouse:#1f8f9e; --nightlife:#d6379e; --residential:#e0a63c;
  --works:#c25a2c; --tower:#6d84a8; --deadzone:#3f434a;
  --p-red:#ff4b5c; --p-blue:#3b82ff; --p-white:#eef3fb; --p-orange:#ff9f2e;
  --piece-line:#04060b; --token:#f2efe4; --token-ink:#15171d; --token-red:#d41f3d;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 34px rgba(0,0,0,.5);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
[hidden]{display:none!important}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.55rem;font-weight:800;line-height:1.1}
h2{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
p{margin:0}
a{color:var(--accent)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px max(20px,env(safe-area-inset-right,0px)) 10px max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-family:var(--display);font-weight:800;font-size:1.1rem;letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--accent)}
.bar .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--off)}
.pill.on::before{background:var(--ok)}
.pill.on{color:var(--ink)}

.btn{appearance:none;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:10px;padding:11px 16px;cursor:pointer;min-height:44px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{min-height:32px;padding:4px 10px;font-size:.8rem;border-radius:8px}
.btn.big{width:100%;font-size:1.1rem;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
.small{font-size:.84rem}

/* ---------- host layout ---------- */
.host{display:grid;grid-template-columns:minmax(0,1fr) clamp(370px,27vw,540px);gap:20px;padding:20px;align-items:start}
@media (max-width:980px){.host{grid-template-columns:minmax(0,1fr)}}
.stage{display:flex;flex-direction:column;gap:12px;min-width:0}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:48px}
.banner .what{font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1.15;flex:1;min-width:200px}
.turnchip{display:inline-block;width:.8em;height:.8em;border-radius:3px;border:2px solid var(--piece-line);vertical-align:-.05em;margin-right:.35em}
.boardbox{border-radius:18px;overflow:hidden;box-shadow:var(--shadow);line-height:0;
  background:radial-gradient(120% 100% at 50% 22%,color-mix(in srgb,var(--apron) 42%,var(--panel)),var(--panel))}
/* pan-y, not none: a finger swiped up the board still scrolls the page, so the
   confirm button below it is never stranded. Sideways drags spin the island;
   tilt and zoom are on the buttons and on two fingers. */
svg.board{display:block;width:100%;height:auto;touch-action:pan-y;cursor:grab}
svg.board:active{cursor:grabbing}
.host svg.board{max-height:calc(100vh - 150px)}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.join{display:flex;flex-direction:row;align-items:center;gap:16px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.09em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
#code-input{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.join.mini .qrbox{width:clamp(120px,9vw,190px)}
.join.mini .roomcode{font-size:1.5rem}
.qrbox{width:clamp(168px,13vw,290px);flex:none;background:#fff;border-radius:10px;padding:6px;line-height:0}
.qrbox svg{width:100%;height:auto;display:block}
.qrfallback{line-height:1.3;color:#333;font-size:.8rem;padding:12px}
.joininfo{display:flex;flex-direction:column;gap:4px;min-width:0}
.roomcode{font-family:var(--display);font-weight:800;font-size:2.3rem;letter-spacing:.12em;line-height:1}
.joinurl{font-size:.78rem;overflow-wrap:anywhere}
.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:.86rem}
.warn code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;background:rgba(0,0,0,.08);padding:1px 5px;border-radius:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input[type=text]{flex:1;min-width:0}
input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;font-size:16px}
.seats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.seat{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.seat.open{border-style:dashed;color:var(--muted)}
.seat.active{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.chip{width:26px;height:26px;border-radius:7px;border:2px solid var(--piece-line)}
.seat .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .sub{font-size:.78rem;color:var(--muted)}
.seat .sub .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--off);margin-right:5px}
.seat .sub .dot.on{background:var(--ok)}
.seat .end{display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.dice{font-size:1.7rem;line-height:1;letter-spacing:.05em}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{appearance:none;border:0;background:transparent;padding:10px;cursor:pointer;font-weight:600;min-height:44px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted);max-height:180px;overflow:auto}
.log li:first-child{color:var(--ink)}

/* ---------- phone layout ---------- */
.phone{max-width:560px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.phone .boardbox{margin-inline:-16px;border-radius:0}
.phone svg.board{max-height:56vh}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{appearance:none;border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.78rem;font-weight:600;min-height:64px}
.sw .chip{width:30px;height:30px}
.sw[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.sw:disabled{opacity:.35;cursor:not-allowed}
.me{display:flex;align-items:center;gap:10px}
.me .chip{width:34px;height:34px;border-radius:9px}
.me .nm{font-family:var(--display);font-weight:800;font-size:1.3rem;line-height:1.1}
.hand{display:flex;gap:8px;flex-wrap:wrap}
.res{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px 6px 6px;font-weight:700;text-transform:capitalize}
.res b{display:inline-grid;place-items:center;width:30px;height:38px;border-radius:6px;border:2px solid var(--piece-line);color:#fff;font-family:var(--display);font-size:1.05rem;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.res b.dk{color:#14110a;text-shadow:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);line-height:1.2}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--piece-line)}
.ico{display:inline-block;width:34px;height:34px;flex:none;background:center/contain no-repeat}
.legend .ico{width:20px;height:20px;border:0;border-radius:0}
.res.art{padding:4px 12px 4px 6px}
.res.art strong{font-family:var(--display);font-size:1.25rem;font-variant-numeric:tabular-nums}
.hero{aspect-ratio:3/2;border-radius:10px;background:var(--apron2) var(--hero) center/cover no-repeat;margin:-4px -4px 4px}
.hex.art{stroke:#efe2b8;stroke-width:3.5}
.actionbar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.actionbar .btn{flex:1;box-shadow:var(--shadow)}
.rolls{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rolls li{display:flex;align-items:center;gap:10px}
.rolls .chip{width:20px;height:20px;border-radius:5px}
.rolls .grow{flex:1;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:.88rem;box-shadow:var(--shadow);z-index:20;max-width:calc(100vw - 32px);text-align:center}

/* ---------- board pieces ---------- */
/* Stroke widths and font sizes are written per frame so they hold their
   apparent size as the camera moves, which is why they are not pinned here:
   a rule in the stylesheet would beat the attribute on the element. */
.hexline{fill:none;stroke:rgba(196,214,244,.52);stroke-width:2.5;stroke-linejoin:round}
.hlabel{font-family:var(--body);font-weight:800;letter-spacing:.1em;text-anchor:middle;fill:#14110a}
.hlabel.lt{fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.45);stroke-width:2.2px}
.tok circle{fill:var(--token);stroke:rgba(0,0,0,.35);stroke-width:1.5}
.tok text{font-family:var(--display);font-weight:800;text-anchor:middle;fill:var(--token-ink)}
.tok .pip{fill:var(--token-ink);stroke:none}
.tok.red text{fill:var(--token-red)}.tok.red .pip{fill:var(--token-red)}
.pier{stroke:var(--frame);stroke-linecap:round}
.hb circle{fill:var(--token)}
.hb ellipse{stroke:none}
.hb text{font-family:var(--display);font-weight:800;text-anchor:middle;fill:var(--token-ink)}
.hb .r{font-family:var(--body);font-weight:800;letter-spacing:.02em}
.police{fill:#2a2f33;stroke:#0c0e0f;stroke-width:1.5}
.pc{pointer-events:none}
.lastring{fill:none;stroke:#fff;stroke-width:2.5;stroke-dasharray:4 4}
.spot,.espot{cursor:pointer}
.spot .hit,.espot .hit{fill:transparent;stroke:transparent}
.spot .casing{fill:var(--piece-line);opacity:.55}
.espot .ecasing{stroke:var(--piece-line);stroke-linecap:round;opacity:.6}
.espot.sel .ecasing{display:none}
.spot .dot{fill:#fff;transform-box:fill-box;transform-origin:center;animation:pulse 1.5s ease-in-out infinite}
.espot .dash{stroke:#fff;stroke-linecap:round;animation:fade 1.5s ease-in-out infinite}
.spot.sel .dot{animation:none;stroke:var(--piece-line)}
.espot.sel .dash{animation:none}
.espot .under{stroke:var(--piece-line);stroke-linecap:round}

/* ---------- camera ---------- */
.board3d{line-height:0}
.camctl{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px;line-height:1.45;
  background:var(--panel);border-top:1px solid var(--line)}
.camctl button{appearance:none;display:inline-grid;place-items:center;width:42px;height:42px;padding:0;
  border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);cursor:pointer}
.camctl button.wide{width:auto;padding:0 14px;font-size:.82rem;font-weight:700}
.camctl button:hover{border-color:var(--accent);color:var(--accent)}
.camctl svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@keyframes pulse{0%,100%{transform:scale(.8);opacity:.75}50%{transform:scale(1.15);opacity:1}}
@keyframes fade{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.spot .dot,.espot .dash{animation:none}}
</style>
</head>

/* =====================================================================

const BROKERS = [

const TERRAIN_OF = { product: 'warehouse', talent: 'nightlife', cash: 'residential', muscle: 'works', influence: 'tower' };

// Number tokens in A–R order, laid along the spiral.
const TOKENS = [5, 2, 6, 3, 8, 10, 9, 12, 11, 4, 8, 10, 9, 4, 5, 6, 3, 11];

/* A street: a bar of colour lying along the edge, with its sides shaded. */
function street(P, C, e, col, top) {

  if (lo.some(p => !p) || hi.some(p => !p)) return '';

}

/* An operation is a little house; a major holding is the same house grown a
   storey with a tower, so the two read apart at a glance from any angle. */
function building(P, C, v, col, top, big) {
  const w = big ? 13 : 11, wall = big ? 17 : 13, ridge = big ? 31 : 26;
  const sq = [[-w, -w], [w, -w], [w, w], [-w, w]];
  const lo = sq.map(p => P(v.x + p[0], top, v.y + p[1]));
  const hi = sq.map(p => P(v.x + p[0], top + wall, v.y + p[1]));
  const r1 = P(v.x - w, top + ridge, v.y), r2 = P(v.x + w, top + ridge, v.y);
  const sh = P(v.x, top, v.y);
  if (lo.some(p => !p) || hi.some(p => !p) || !r1 || !r2 || !sh) return '';
  const g = [`<ellipse cx="${n1(sh.x)}" cy="${n1(sh.y)}" rx="${n1(w * 1.5 * sh.k)}" ry="${n1(w * 1.5 * sh.k * Math.max(.18, Math.sin(CAM.pitch * Math.PI / 180)))}" fill="rgba(0,0,0,.3)"/>`];
  const N = [[0, 0, -1], [1, 0, 0], [0, 0, 1], [-1, 0, 0]];
  const sv = ['#000', '#fff'];
  for (let k = 0; k < 4; k++) {
    const j = (k + 1) % 4, mp = [v.x + (sq[k][0] + sq[j][0]) / 2, top + wall / 2, v.y + (sq[k][1] + sq[j][1]) / 2];
    if (!faces(C, N[k], mp)) continue;
    g.push(shadeFace([hi[k], hi[j], lo[j], lo[k]], N[k], col));
  }
  // the two slopes of the roof and its gable ends
  const rl = Math.hypot(w, ridge - wall);   // the slope's own normal, not a guess at one
  [[-1, [hi[0], hi[1], r2, r1]], [1, [hi[3], hi[2], r2, r1]]].forEach(([sgn, q]) => {
    const n = [0, w / rl, sgn * (ridge - wall) / rl];
    if (faces(C, n, [v.x, top + (wall + ridge) / 2, v.y + sgn * w / 2])) g.push(shadeFace(q, n, col));

    if (faces(C, f.n, [v.x + f.n[0] * w, top + wall, v.y])) g.push(shadeFace(f.q, f.n, col));

/* =====================================================================

/* the buttons under the board, and the arrow keys once it has focus */
const CAM_BTNS = [
  ['left', 'Turn left', 'M14 4 6 12l8 8'], ['right', 'Turn right', 'M10 4l8 8-8 8'],
  ['up', 'Tilt down towards the table', 'M4 14l8-8 8 8'], ['down', 'Tilt up towards a map view', 'M4 10l8 8 8-8'],
  ['in', 'Zoom in', 'M12 5v14M5 12h14'], ['out', 'Zoom out', 'M5 12h14'],

function camAction(k) {

    case 'right': nudge(c => { c.yaw += 15; }); break;

/* The board plus the buttons that move the camera. Remembering the options

function boardView(st, o) {

/* =====================================================================
   Relay (MQTT over secure WebSocket)
   ===================================================================== */
function openClient(uri, clientId, will, on) {
  return new Promise((resolve, reject) => {
    if (!window.Paho || !Paho.Client) { reject(new Error('The networking library did not load. Check the internet connection and reload.')); return; }
    let done = false, dead = false, c;
    const fail = err => { if (done) return; done = true; dead = true; try { c.disconnect(); } catch (e) { /* not connected */ } reject(err); };
    try { c = new Paho.Client(uri, clientId); } catch (e) { reject(e); return; }
    c.onMessageArrived = m => { if (dead) return; let body; try { body = m.payloadString; } catch (e) { return; } on.message(m.destinationName, body); };
    c.onConnectionLost = () => { if (!dead) on.down(); };
    c.onConnected = () => { if (dead) { try { c.disconnect(); } catch (e) { /* closing */ } return; } on.up(c); };
    const opts = {
      timeout: 7, keepAliveInterval: 20, cleanSession: true, reconnect: true, mqttVersion: 4,
      onSuccess: () => { if (done) return; done = true; resolve(c); },
      onFailure: e => fail(new Error((e && e.errorMessage) || 'Could not reach the relay')),
    };
    if (will) { const w = new Paho.Message(will.body); w.destinationName = will.topic; w.qos = 1; w.retained = true; opts.willMessage = w; }
    try { c.connect(opts); } catch (e) { fail(e); return; }
    setTimeout(() => fail(new Error('The relay did not answer in time')), 9000);
  });
}

  if (!client || !client.isConnected()) return false;
  try { const m = new Paho.Message(typeof body === 'string' ? body : JSON.stringify(body)); m.destinationName = topic; m.qos = 1; m.retained = !!retained; client.send(m); return true; }
  catch (e) { return false; }
}

/* ---------- shared runtime ---------- */
const params = new URLSearchParams(location.search);
const ROOM_ABC = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const joinRoom = (params.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
const WATCH = !!joinRoom && params.has('watch'); // read-only big-board view of someone else's table
const ROOM_LETTERS = 'ABCDEFGHJKMNPQRSTUVWXYZ';
const G = { client: null, online: false, state: null, hist: [], b: 0 };
const ui = { sel: null, pending: false, toast: null, toastTimer: 0 };

function toast(msg) {
  clearTimeout(ui.toastTimer); let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }

}
// A sleeping phone drops its socket. The state lives on the relay and in localStorage, so a reload resumes cleanly.
// The relay client reconnects by itself, but its back-off grows to two minutes. If it is still down a while
// after the page is looked at again (or after 25 s online), reload: boot retries until it connects.
function safeRender() { try { if (joinRoom && !WATCH) renderPlayer(); else renderHost(); } catch (e) { console.error(e); } }

async function keepAwake() { try { if (navigator.wakeLock && document.visibilityState === 'visible') await navigator.wakeLock.request('screen'); } catch (e) { /* not allowed or not supported */ } }

  const done = () => toast(what + ' copied');

  else prompt('Copy this link', text);
}
const stuck = () => G.client && !G.client.isConnected() && navigator.onLine !== false && document.visibilityState === 'visible';
document.addEventListener('visibilitychange', () => { if (document.visibilityState !== 'visible') return; if (!joinRoom || WATCH) keepAwake(); setTimeout(() => { if (stuck()) location.reload(); }, 6000); });
let downTicks = 0;
setInterval(() => { if (!stuck()) { downTicks = 0; return; } if (++downTicks >= 5) location.reload(); }, 5000);

/* =====================================================================
   TABLE (host)
   ===================================================================== */
function hostBase() { return TOPIC_ROOT + G.state.room; }
function newTableState(kind) {
  return { v: 0, room: makeCode(5, ROOM_LETTERS) + '2', phase: 'lobby', board: makeBoard(kind || 'random'), players: [], order: [], contenders: [], rolls: {}, round: 1,
    starter: null, placeIdx: 0, step: 'operation', lastV: null, buildings: {}, streets: {}, log: ['Table opened. Scan the code to take a seat.'] };
}

  publishState(G.client); renderHost();
}

    case 'join': {

      if (p) { if (st.phase === 'lobby') p.name = name; p.online = true; commit(); return; }
      if (st.phase !== 'lobby' || st.players.length >= MAX_PLAYERS) return;
      const free = COLORS.filter(c => !st.players.some(x => x.color === c));

  if (!obj(s.streets) || !Object.keys(s.streets).every(k => num(k) && +k < GEO.edges.length && known(s.streets[k]))) return false;
  if (!int(s.placeIdx) || s.placeIdx < 0 || !int(s.round)) return false;
  if (s.lastV !== null && !(int(s.lastV) && s.lastV >= 0 && s.lastV < GEO.verts.length)) return false;
  if (s.phase === 'place' && (!s.order.length || s.order.length !== s.players.length || s.placeIdx >= s.order.length * 2)) return false;
  if ((s.phase === 'place' || s.phase === 'done') && !known(s.starter)) return false;
  return true;
}
function act(body) {
  if (!send(G.client, P.base + '/act', Object.assign({ pid: PID }, body))) { toast('Not connected. Trying again in a moment.'); return false; }
  return true;
}
function playerScreen() {
  const st = G.state;
  if (P.error) return 'error';
  if (!st) return P.waited ? 'notable' : 'connecting';
  const me = playerOf(st, PID);
  if (!me) return st.phase !== 'lobby' ? 'spectate' : st.players.length >= MAX_PLAYERS ? 'full' : 'join';
  return st.phase;
}
function handHTML(me) {
  const have = RES_ORDER.filter(r => me.hand[r]);
  return have.length ? `<div class="hand">${have.map(r => ART
    ? `<span class="res art"><i class="ico" style="background-image:var(--ico-${r})"></i><strong>${me.hand[r]}</strong>${r}</span>`
    : `<span class="res"><b class="${r === 'cash' ? 'dk' : ''}" style="background:var(--${TERRAIN_OF[r]})">${me.hand[r]}</b>${r}</span>`).join('')}</div>` : '<p class="muted small">No cards yet.</p>';
}
function meHTML(me, sub) { return `<div class="me"><span class="chip" style="background:var(--p-${me.color})"></span><div><p class="nm">${esc(me.name)}</p><p class="muted small">${sub}</p></div></div>`; }

function renderPlayer() {
  const st = G.state, screen = playerScreen(), me = st && playerOf(st, PID);
  if (!$('#p-main')) {
    $('#app').innerHTML = `<header class="bar"><span class="brand">Run the <i>City</i></span><span class="muted small">Table ${esc(joinRoom)}</span><span class="grow"></span><span id="p-status" class="pill">Connecting</span></header>
      <main class="phone"><div id="p-alert"></div><div id="p-main" style="display:contents"></div></main>`;
  }
  $('#p-status').className = 'pill' + (G.online ? ' on' : ''); setHTML('#p-status', G.online ? 'Connected' : 'Connecting');
  setHTML('#p-alert', st && P.hostUp === false ? '<div class="warn"><p><strong>The table screen is offline.</strong> Your seat is safe. Play resumes when it reconnects.</p></div>' : '');
  const turnKey = st ? [st.phase, st.round, st.placeIdx, st.step, Object.keys(st.buildings || {}).length, st.rolls && st.rolls[PID] ? 1 : 0].join('|') : '';
  if (turnKey !== P.turnKey) { P.turnKey = turnKey; ui.pending = false; ui.sel = null; clearTimeout(ui.pendTimer); }
  const changed = screen !== P.screen; P.screen = screen;

  if (screen === 'join') {
    const free = COLORS.filter(c => !st.players.some(p => p.color === c));
    if (!free.includes(P.color)) P.color = free[0];
    if (changed) {
      $('#p-main').__h = null;
      $('#p-main').innerHTML = `<section class="card"><h1>Take a seat</h1><div><label for="p-name" class="small muted">Your name</label><input type="text" id="p-name" maxlength="14" autocomplete="nickname" enterkeyhint="done" placeholder="Name on the table" value="${esc(P.name)}"></div>
        <div><p class="small muted" id="p-swl">Your colour</p><div id="p-sw" class="swatches" role="group" aria-labelledby="p-swl"></div></div>
        <button class="btn big" data-p="join">Join the table</button></section><div class="boardbox" id="p-board"></div>`;
    }
    setHTML('#p-sw', COLORS.map(c => `<button class="sw" data-p="pick" data-arg="${c}" aria-pressed="${c === P.color}" ${free.includes(c) ? '' : 'disabled'}><span class="chip" style="background:var(--p-${c})"></span>${free.includes(c) ? cap(c) : 'Taken'}</button>`).join(''));
    setHTML('#p-board', boardView(st));
    return;
  }

  let h = '';
  if (screen === 'connecting') h = '<section class="card"><h1>Finding the table…</h1><p class="muted">Connecting your phone to the table screen.</p></section>';
  else if (screen === 'error') h = `<section class="card"><h1>Could not connect</h1><p>${esc(P.error)}</p><button class="btn" data-p="reload">Try again</button></section>`;
  else if (screen === 'notable') h = `<section class="card"><h1>No table answers to ${esc(joinRoom)}</h1><p class="muted">The table may have closed, or the code is from an older game. Scan the code on the table screen again.</p><button class="btn" data-p="reload">Look again</button></section>`;
  else if (screen === 'full') h = '<section class="card"><h1>All four seats are taken</h1><p class="muted">You can watch from here. If someone leaves, a seat opens up.</p></section><div class="boardbox">' + boardView(st) + '</div>';
  else if (screen === 'spectate') h = '<section class="card"><h1>This game has already started</h1><p class="muted">You are watching. If you were seated before, open the join link on the same phone and browser you used.</p></section><div class="boardbox">' + boardView(st) + '</div>';
  else if (screen === 'lobby') {
    const free = COLORS.filter(c => !st.players.some(p => p.color === c));
    h = `<section class="card">${meHTML(me, "You're in. Waiting for the table to start.")}
      <div><p class="small muted">Change colour</p><div class="swatches">${COLORS.map(c => `<button class="sw" data-p="recolor" data-arg="${c}" aria-pressed="${c === me.color}" ${c === me.color || free.includes(c) ? '' : 'disabled'}><span class="chip" style="background:var(--p-${c})"></span>${c === me.color ? 'Yours' : free.includes(c) ? cap(c) : 'Taken'}</button>`).join('')}</div></div>
      <p class="small muted">${st.players.length} of ${MAX_PLAYERS} seated: ${esc(st.players.map(p => p.name).join(', '))}</p>
      <button class="btn ghost" data-p="leave">Leave the table</button></section><div class="boardbox">${boardView(st)}</div>`;
  } else if (screen === 'rolloff') {
    const mine = st.rolls[PID], inIt = st.contenders.includes(PID), must = inIt && !mine;
    h = `<section class="card">${meHTML(me, !inIt ? 'You are out of this tie-break.' : must ? 'Highest roll places first.' : `You rolled ${mine[0] + mine[1]}. Waiting for the others.`)}
      ${must ? `<button class="btn big" data-p="roll" ${ui.pending ? 'disabled' : ''}>Roll the dice</button>` : ''}
      <ul class="rolls">${st.players.map(p => { const r = st.rolls[p.pid]; return `<li><span class="chip" style="background:var(--p-${p.color})"></span><span class="grow">${esc(p.name)}</span>${!st.contenders.includes(p.pid) ? `<span class="muted small">out${r ? ' with ' + (r[0] + r[1]) : ''}</span>` : r ? `<span class="dice" aria-hidden="true">${DIE[r[0]]}${DIE[r[1]]}</span><strong>${r[0] + r[1]}</strong>` : '<span class="muted small">rolling…</span>'}</li>`; }).join('')}</ul></section>`;
  } else if (screen === 'place') {
    const active = activePid(st), mineTurn = active === PID, ap = playerOf(st, active), nth = st.placeIdx < st.order.length ? 1 : 2;
    const tip = mineTurn ? (st.step === 'operation' ? `Tap a glowing spot for your ${ordinal(nth)} operation.${nth === 2 ? ' This one pays your starting cards.' : ''}` : 'Tap a glowing path next to the operation you just placed.') : `${esc(ap.name)} is placing a ${st.step}.`;
    h = `<section class="card">${meHTML(me, tip)}${handCount(me) ? handHTML(me) : ''}</section>
      <div class="boardbox">${boardView(st, mineTurn ? { labels: true, color: me.color, sel: ui.sel, legalV: st.step === 'operation' ? legalOperations(st) : [], legalE: st.step === 'street' ? legalSetupStreets(st) : [] } : { labels: true })}</div>${LEGEND}
      ${mineTurn ? `<div class="actionbar"><button class="btn big" data-p="confirm" ${ui.sel && !ui.pending ? '' : 'disabled'}>${ui.pending ? 'Placing…' : ui.sel ? `Place ${st.step} here` : `Pick a spot for your ${st.step}`}</button></div>` : ''}`;
  } else if (screen === 'done') {
    const first = playerOf(st, st.starter);
    h = `<section class="card">${meHTML(me, first.pid === PID ? 'Set-up is done. You take the first turn.' : `Set-up is done. ${esc(first.name)} takes the first turn.`)}
      <h2>Your starting cards</h2>${handHTML(me)}<p class="small muted">2 victory points &middot; 3 operations, 13 streets and 4 major holdings left to build</p></section><div class="boardbox">${boardView(st, { labels: true })}</div>${LEGEND}`;
  }
  setHTML('#p-main', h);
}

async function bootPlayer() {
  const render = WATCH ? renderHost : renderPlayer;
  render(); if (WATCH) keepAwake();
  // the relay is named by the last character of the table code (older links carried it as &b=)
  let b = parseInt(params.get('b'), 10);
  if (!(b >= 0 && b < BROKERS.length)) b = parseInt(joinRoom.slice(-1), 10) - 2;
  if (!(b >= 0 && b < BROKERS.length)) b = 0;
  try {
    G.client = await openClient(BROKERS[b], 'rtcity-' + (WATCH ? 'w' + makeCode(7, ROOM_ABC) : PID) + '-' + makeCode(4, ROOM_ABC), WATCH ? null : { topic: P.base + '/pres/' + PID, body: '0' }, {
      message: (topic, body) => {
        if (topic === P.base + '/host') { P.hostUp = body === '' ? null : body === '1'; safeRender(); return; }
        if (topic !== P.base + '/state') return;
        if (!body) { G.state = null; P.waited = true; safeRender(); return; }
        let s = null; try { s = JSON.parse(body); } catch (e) { return; }
        if (!validState(s)) return;
        if (G.state && s.v < G.state.v) return;
        const prev = G.state; if (prev && s.v > prev.v) P.hostUp = true; // a fresh state means the table is alive
        G.state = s; const me = WATCH ? null : playerOf(s, PID);
        if (me && !me.online && G.online) send(G.client, P.base + '/pres/' + PID, '1', true);
        try { render(); } catch (e) { console.error(e); G.state = prev; safeRender(); }
      },
      up: c => {
        G.online = true; c.subscribe(P.base + '/state', { qos: 1 }); c.subscribe(P.base + '/host', { qos: 1 }); if (!WATCH) send(c, P.base + '/pres/' + PID, '1', true);
        clearTimeout(P.waitTimer); P.waitTimer = setTimeout(() => { P.waited = true; if (!G.state) safeRender(); }, 5000); safeRender();
      },
      down: () => { G.online = false; safeRender(); },
    });
    G.online = true; render();
  } catch (e) { P.error = (e.message || 'The relay could not be reached.') + ' Trying again in a few seconds.'; render(); setTimeout(() => { P.error = ''; bootPlayer(); }, 5000); }
}

/* =====================================================================
   Events (delegated)
   ===================================================================== */
/* A tap rarely lands exactly on a spot. Each frame records where every spot
   ended up on screen, along with the scale there, so a far corner of a tilted
   board is no harder to hit than a near one. */
function nearestSpot(ev) {
  const svg = ev.target.closest && ev.target.closest('svg.board'); if (!svg || !svg.getScreenCTM) return null;
  const m = svg.getScreenCTM(); if (!m) return null;
  const pt = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(m.inverse());
  let best = null, bestD = Infinity;
  const look = (map, attr) => Object.keys(map).forEach(id => {
    const s = map[id], d = Math.hypot(pt.x - s.x, pt.y - s.y);
    if (d < 48 * s.k && d < bestD) { bestD = d; best = svg.querySelector('[' + attr + '="' + id + '"]'); }
  });
  look(PROJ.v, 'data-v'); look(PROJ.e, 'data-e');
  return best;
}
function pickSpot(target, ev) {
  if (view.swallow) return false;                       // that gesture was moving the camera
  // Tilting the board foreshortens it, so neighbouring spots crowd together and their
  // hit shapes overlap. Ask which one is actually nearest the finger first: letting the
  // plain hit test win would hand the tap to whichever spot happened to be drawn last.
  const g = (ev && nearestSpot(ev)) || target.closest('[data-v],[data-e]'); if (!g) return false;
  ui.sel = g.dataset.v !== undefined ? { kind: 'v', id: +g.dataset.v } : { kind: 'e', id: +g.dataset.e };
  if (WATCH) return false;
  if (joinRoom) renderPlayer(); else renderHost();
  const again = document.querySelector(ui.sel.kind === 'v' ? `[data-v="${ui.sel.id}"]` : `[data-e="${ui.sel.id}"]`);
  if (again && again.focus) again.focus({ preventScroll: true });
  return true;
}
document.addEventListener('click', ev => {
  if (pickSpot(ev.target, ev)) return;
  const hb = ev.target.closest('[data-h]'), pb = ev.target.closest('[data-p]'), cb = ev.target.closest('[data-c]');
  if (cb) { if (cb.dataset.c === 'watch') copyText(watchURL(), 'Board link'); else copyText(joinURL(), 'Phone link'); return; }
  if (ev.target.closest('[data-l=host]')) { bootHost(); return; }
  const cam = ev.target.closest('[data-cam]');
  if (cam) { camAction(cam.dataset.cam); return; }
  if (ev.target.closest('[data-h-clear]')) { ui.sel = null; renderHost(); return; }
  if (hb) { if (hb.dataset.h === 'clearbase') { store('rtcity.base', null); renderHost(); } else hostControl(hb.dataset.h, hb.dataset.arg); return; }
  if (!pb) return;
  const st = G.state;
  switch (pb.dataset.p) {
    case 'reload': location.reload(); break;
    case 'pick': P.color = pb.dataset.arg; renderPlayer(); break;
    case 'join': { const n = ($('#p-name').value || '').trim(); if (!n) { toast('Add your name first.'); $('#p-name').focus(); break; } P.name = n; store('rtcity.name', n); if (act({ t: 'join', name: n, color: P.color })) toast('Taking your seat…'); break; }
    case 'recolor': act({ t: 'color', color: pb.dataset.arg }); break;
    case 'leave': act({ t: 'leave' }); break;
    case 'roll': if (act({ t: 'roll' })) { ui.pending = true; renderPlayer(); clearTimeout(ui.pendTimer); ui.pendTimer = setTimeout(() => { if (ui.pending) { ui.pending = false; renderPlayer(); } }, 4000); } break;
    case 'confirm':
      if (!ui.sel || !st) break;
      if (act(ui.sel.kind === 'v' ? { t: 'operate', v: ui.sel.id } : { t: 'street', e: ui.sel.id })) {
        ui.pending = true; renderPlayer();
        clearTimeout(ui.pendTimer); ui.pendTimer = setTimeout(() => { if (ui.pending) { ui.pending = false; renderPlayer(); toast('The table did not answer. Try again.'); } }, 4000);
      }
      break;
  }
});
document.addEventListener('keydown', ev => {
  if (CAM_KEYS[ev.key] && !ev.metaKey && !ev.ctrlKey && !ev.altKey && ev.target.closest && ev.target.closest('.boardbox')) {
    ev.preventDefault(); camAction(CAM_KEYS[ev.key]); return;
  }
  const g = (ev.key === 'Enter' || ev.key === ' ') && ev.target.closest && ev.target.closest('[data-v],[data-e]'); if (!g) return;
  ev.preventDefault();
  if (g.classList.contains('sel')) { const go = document.querySelector('[data-p=confirm]:not(:disabled),[data-h=confirm]'); if (go) go.click(); return; }
  pickSpot(ev.target);
});
document.addEventListener('input', ev => { if (ev.target.id === 'p-name') { P.name = ev.target.value; store('rtcity.name', P.name.trim().slice(0, 14)); } });
document.addEventListener('submit', ev => {
  const cf = ev.target.closest('[data-form=code]');
  if (cf) {
    ev.preventDefault();
    const code = ($('#code-input').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length < 5) { toast('Enter the code shown on the table screen.'); $('#code-input').focus(); return; }
    const watch = ev.submitter && ev.submitter.dataset.mode === 'watch';
    location.href = pageBase() + '?room=' + code + (watch ? '&watch=1' : ''); return;
  }
  const f = ev.target.closest('[data-form=base]'); if (!f) return; ev.preventDefault();
  const v = $('#base-input').value.trim(); store('rtcity.base', v || null); renderHost();
});

bindCamera(document);
(() => {                                                  // pick up where this screen left the camera
  const c = load('rtcity.cam');
  if (c && ['yaw', 'pitch', 'dist'].every(k => typeof c[k] === 'number' && isFinite(c[k]))) {
    CAM.yaw = c.yaw; CAM.pitch = c.pitch; CAM.dist = c.dist; clampCam();
  }
})();

let autohost = false; try { autohost = sessionStorage.getItem('rtcity.autohost') === '1'; } catch (e) { /* private mode */ }
if (joinRoom) bootPlayer();
else if (load('rtcity.host') || autohost) bootHost(); // this browser already runs a table: go straight back to it
else renderLanding();
})();
</script>
</body>
</html>
